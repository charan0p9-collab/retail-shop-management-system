        function handlePosSearch(term) {
            const filtered = state.products.filter(p => 
                p.name.toLowerCase().includes(term.toLowerCase()) || 
                p.category.toLowerCase().includes(term.toLowerCase())
            );
            document.getElementById('pos-product-grid').innerHTML = renderPosProductGrid(filtered);
        }

        function addPosItem(productId) {
            const product = state.products.find(p => p.id === productId);
            if(!product) return;
            if(product.qty <= 0) { showToast('Out of stock!', 'error'); return; }

            const existing = state.manualBillingCart.find(item => item.id === productId);
            const custTypeEl = document.getElementById('pos-customer-type');
            const custType = custTypeEl ? custTypeEl.value : 'retail';
            const price = custType === 'wholesale' ? product.wholesalePrice : product.retailPrice;

            if (existing) {
                if (existing.qty >= product.qty) {
                    showToast('Max stock reached.', 'info');
                    return;
                }
                existing.qty++;
                existing.price = price; 
            } else {
                state.manualBillingCart.push({ ...product, qty: 1, price: price });
            }
            renderManualBillingCart();
        }

        function updatePosItemQty(productId, change) {
            const itemIndex = state.manualBillingCart.findIndex(item => item.id === productId);
            if (itemIndex > -1) {
                const item = state.manualBillingCart[itemIndex];
                const product = state.products.find(p => p.id === productId);
                
                let newQty = item.qty + change;
                if (newQty > product.qty) {
                    showToast('Cannot exceed available stock.', 'info');
                    newQty = product.qty;
                }
                if (newQty <= 0) {
                    state.manualBillingCart.splice(itemIndex, 1);
                } else {
                    item.qty = newQty;
                }
                renderManualBillingCart();
            }
        }

        function removePosItem(productId) {
            state.manualBillingCart = state.manualBillingCart.filter(item => item.id !== productId);
            renderManualBillingCart();
        }

        function clearPosCart() {
            state.manualBillingCart = [];
            state.deliveryFee = 0;
            state.discount = 0;
            renderManualBillingCart();
        }

            if(state.manualBillingCart.length === 0) return '<div class="h-full flex flex-col items-center justify-center text-slate-400"><i class="fas fa-shopping-basket text-4xl mb-3 opacity-20"></i><p class="text-sm font-medium">Cart is empty</p></div>';
            
            return `<div class="space-y-3">` + state.manualBillingCart.map(item => `
                <div class="flex items-center gap-3 p-3 bg-white rounded-xl border border-slate-100 shadow-sm">
                    <img src="${item.img || 'https://placehold.co/50x50/e2e8f0/64748b?text=Img'}" class="w-12 h-12 rounded-lg object-cover bg-slate-50 p-1 border border-slate-100">

                    <div class="flex items-center gap-2 bg-slate-100 rounded-lg p-1 border border-slate-200">

                        <span class="text-sm font-black w-6 text-center">${item.qty}</span>
                        <button onclick="updatePosItemQty('${item.id}', 1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow-sm text-slate-600 hover:text-emerald-500"><i class="fas fa-plus text-[10px]"></i></button>

            const subtotal = state.manualBillingCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const total = subtotal + parseFloat(state.deliveryFee || 0) - parseFloat(state.discount || 0);
            
            return `
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between text-slate-500 font-bold"><span>Subtotal (${state.manualBillingCart.length} items)</span><span>₹${subtotal.toLocaleString()}</span></div>
                    
                    <div class="flex justify-between items-center group">

                        </div>

        function renderManualBillingCart() {
            // Need to update prices based on customer type if it changed
            const custTypeEl = document.getElementById('pos-customer-type');
            if (custTypeEl) {
                const custType = custTypeEl.value;
                state.manualBillingCart.forEach(item => {
                    const product = state.products.find(p => p.id === item.id);
                    if(product) {
                        item.price = custType === 'wholesale' ? product.wholesalePrice : product.retailPrice;
                    }
                });
            }

            const cartContainer = document.getElementById('pos-cart-items');
            if(cartContainer) {
                cartContainer.innerHTML = renderPosCartItems();
                
                // Re-render totals area carefully to not lose focus if typing
                const parent = cartContainer.parentElement;
                const p5div = parent.querySelector('.p-5');
                if(p5div) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = renderPosTotals();
                    const newTotals = tempDiv.firstElementChild;
                    
                    const existingTotals = p5div.querySelector('.space-y-2.text-sm');
                    if(existingTotals) {

                render(); // Fallback

        function processPosCheckout() {
            if(state.manualBillingCart.length === 0) { showToast('Cart is empty', 'error'); return; }
            
            const customerNameEl = document.getElementById('pos-customer-name');
            const customerName = customerNameEl ? customerNameEl.value.trim() || 'Walk-in Customer' : 'Walk-in Customer';
            
            const paymentEl = document.getElementById('pos-payment-method');
            const paymentMethod = paymentEl ? paymentEl.value : 'Cash';
            
            const subtotal = state.manualBillingCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const total = subtotal + parseFloat(state.deliveryFee || 0) - parseFloat(state.discount || 0);

            const newOrder = {
                id: generateId('INV'),
                customerId: 'POS',
                customer: customerName,
                mobile: 'N/A',
                address: 'In-Store',
                items: [...state.manualBillingCart],
                subtotal: subtotal,
                deliveryFee: parseFloat(state.deliveryFee || 0),
                discount: parseFloat(state.discount || 0),
                total: total,
                date: new Date().toISOString(),
                status: 'Delivered', // Immediate delivery for POS
                paymentMethod: paymentMethod,
                paymentStatus: 'Paid', // Settled at counter
                location: state.currentUser.location // Store admin location
            };

            state.orders.push(newOrder);

            // Deduct stock
            state.manualBillingCart.forEach(item => {
                const product = state.products.find(p => p.id === item.id);
                if(product) product.qty -= item.qty;
            });

            saveDatabase();
            showToast('Sale completed successfully!');
            showBillModal(newOrder);
            clearPosCart();
        }

        // Shared by customer-initiated cancellation and admin cancel/refund: puts sold
        // stock back into inventory and reverses the loyalty points this order earned
        // (redeemed points are NOT restored automatically — the discount they paid for
        // was already given). Guarded by order.stockReversed so it only ever runs once
        // per order, however many times the status is changed afterwards.
        function reverseOrderInventoryAndPoints(order) {
            if (!order || order.stockReversed) return;
            (order.items || []).forEach(item => {
                const product = state.products.find(p => p.id === item.id);
                if (product) product.qty += item.qty;
            });
            const orderUser = state.users.find(u => u.id === order.customerId);
            if (orderUser && order.pointsEarned) {
                orderUser.loyaltyPoints = Math.max(0, (orderUser.loyaltyPoints || 0) - order.pointsEarned);
            }
            order.stockReversed = true;
        }

        function updateOrderStatus(id, status) {
            const order = state.orders.find(o => o.id === id);
            if(order) {
                order.status = status;
                if (status === 'Canceled' || status === 'Refunded') reverseOrderInventoryAndPoints(order);
                saveDatabase();
                showToast(`Order status updated to ${status}.`);
                render();
            }
        }

        // Customer-initiated cancellation — only while the order hasn't left the shop yet.
        function cancelOrderByCustomer(id) {
            const order = state.orders.find(o => o.id === id && o.customerId === state.currentUser.id);
            if (!order) return;
            if (order.status !== 'Progress' && order.status !== 'Order Confirmed') {
                showToast('This order can no longer be canceled — please contact the store.', 'error');
                return;
            }
            if (!confirm('Cancel this order? This cannot be undone.')) return;
            order.status = 'Canceled';
            reverseOrderInventoryAndPoints(order);
            saveDatabase();
            showToast('Order canceled.', 'info');
            render();
        }

        // Customer-initiated return request — only once an order has actually been delivered.
        function requestReturn(id) {
            const order = state.orders.find(o => o.id === id && o.customerId === state.currentUser.id);
            if (!order || order.status !== 'Delivered') return;
            if (!confirm('Request a return for this order? The store will review and process your refund.')) return;
            order.status = 'Return Requested';
            saveDatabase();
            showToast('Return requested — the store will be in touch shortly.', 'info');
            render();

        // Builds a text-based sales/analytics summary PDF (revenue, profit, top products,
        // customer insights) using jsPDF directly — no screenshot needed.
        function downloadSalesReportPDF() {
            if (!window.jspdf) { showToast('PDF library not loaded. Check your internet connection.', 'error'); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');
            const pageWidth = doc.internal.pageSize.getWidth();
            let y = 50;

            doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
            doc.text(state.shopDetails.name || 'Shop', 40, y);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(100);
            y += 18;
            doc.text(`Sales & Analytics Report — Generated ${new Date().toLocaleString('en-IN')}`, 40, y);
            doc.setDrawColor(220); y += 12; doc.line(40, y, pageWidth - 40, y); y += 28;

            const validOrdersR = state.orders.filter(o => o.status !== 'Canceled' && o.status !== 'Refunded');
            const totalRevenueR = validOrdersR.reduce((sum, o) => sum + o.total, 0);
            let totalProfitR = 0;
            const productMapR = {};
            validOrdersR.forEach(o => (o.items || []).forEach(item => {
                const product = state.products.find(p => p.id === item.id) || state.products.find(p => p.name === item.name);
                if (product) {
                    const profit = (item.price - product.buyPrice) * item.qty;
                    totalProfitR += profit;
                    productMapR[product.id] = productMapR[product.id] || { name: product.name, qty: 0, revenue: 0 };
                    productMapR[product.id].qty += item.qty;
                    productMapR[product.id].revenue += item.price * item.qty;
                }
            }));
            const ordersByCustomerR = {};
            validOrdersR.forEach(o => { ordersByCustomerR[o.customerId] = (ordersByCustomerR[o.customerId] || 0) + 1; });
            const totalCustomersR = Object.keys(ordersByCustomerR).length;
            const repeatCustomersR = Object.values(ordersByCustomerR).filter(c => c > 1).length;
            const avgOrderValueR = validOrdersR.length > 0 ? Math.round(totalRevenueR / validOrdersR.length) : 0;

            doc.setTextColor(20); doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
            doc.text('Summary', 40, y); y += 18;
            doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
            const summaryLines = [
                `Total Orders: ${validOrdersR.length}`,
                `Total Revenue: Rs. ${totalRevenueR.toLocaleString()}`,
                `Total Profit: Rs. ${totalProfitR.toLocaleString()}`,
                `Average Order Value: Rs. ${avgOrderValueR.toLocaleString()}`,
                `Customers Who Ordered: ${totalCustomersR}`,
                `Repeat Customers: ${repeatCustomersR} (${totalCustomersR ? Math.round(repeatCustomersR / totalCustomersR * 100) : 0}%)`,
                `Products in Catalog: ${state.products.length}`,
                `Low Stock Items (<10): ${state.products.filter(p => p.qty < 10).length}`
            ];
            summaryLines.forEach(line => { doc.text(line, 40, y); y += 16; });
            y += 12;

            doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
            doc.text('Top Selling Products', 40, y); y += 8;
            y += 12;
            doc.setFontSize(9); doc.setTextColor(120);
            doc.text('Product', 40, y); doc.text('Qty Sold', 340, y); doc.text('Revenue', 440, y);
            y += 8; doc.setDrawColor(230); doc.line(40, y, pageWidth - 40, y); y += 14;
            doc.setTextColor(20); doc.setFont('helvetica', 'normal');
            const topProductsR = Object.values(productMapR).sort((a, b) => b.qty - a.qty).slice(0, 15);
            if (topProductsR.length === 0) {
                doc.text('No sales data yet.', 40, y); y += 16;
            } else {
                topProductsR.forEach(p => {
                    if (y > 760) { doc.addPage(); y = 50; }
                    doc.text(p.name.substring(0, 45), 40, y);
                    doc.text(String(p.qty), 340, y);
                    doc.text(`Rs. ${p.revenue.toLocaleString()}`, 440, y);
                    y += 16;
                });
            }

            doc.save(`Sales_Report_${new Date().toISOString().split('T')[0]}.pdf`);
            showToast('Sales report downloaded!');
        }

        function downloadFile(content, fileName) {
            const encodedUri = encodeURI(content);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

        // Full-state backup as JSON (uses a Blob rather than the data-URI trick that
        // downloadFile() uses for CSV, since product/order data can be large and can
        // contain characters — quotes, emoji, base64 images — that break cleanly in a URI).
        function exportFullBackup() {
            const dbData = {
                users: state.users,
                products: state.products,
                purchases: state.purchases,
                orders: state.orders,
                shopDetails: state.shopDetails,
                suppliers: state.suppliers,
                deliveryFeeRules: state.deliveryFeeRules,
                coupons: state.coupons,
                reviews: state.reviews,
                banners: state.banners,
                loyaltySettings: state.loyaltySettings
            };
            const blob = new Blob([JSON.stringify(dbData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${(state.shopDetails.name || 'RetailApp').replace(/\s+/g, '_')}_Backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('Backup downloaded.');
        }

        // Restores a previously downloaded backup on this device/browser. Does a light
        // shape check (looks for the expected top-level keys) before overwriting anything,
        // and always asks for confirmation since this replaces all current data.
        function importFullBackup(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                let parsed;
                try {
                    parsed = JSON.parse(ev.target.result);
                } catch (err) {
                    showToast('That file is not valid JSON.', 'error');
                    e.target.value = '';
                    return;
                }
                const expectedKeys = ['users', 'products', 'orders', 'shopDetails'];
                const looksValid = expectedKeys.every(k => Object.prototype.hasOwnProperty.call(parsed, k));
                if (!looksValid) {
                    showToast('This file doesn\'t look like a valid backup.', 'error');
                    e.target.value = '';
                    return;
                }
                if (!confirm('Restore this backup? Your CURRENT data on this device will be replaced. This cannot be undone.')) {
                    e.target.value = '';
                    return;
                }
                state = {
                    ...state,
                    users: parsed.users || [],
                    products: parsed.products || [],
                    purchases: parsed.purchases || [],
                    orders: parsed.orders || [],
                    shopDetails: parsed.shopDetails || state.shopDetails,
                    suppliers: parsed.suppliers || [],
                    deliveryFeeRules: parsed.deliveryFeeRules || [],
                    coupons: parsed.coupons || [],
                    reviews: parsed.reviews || [],
                    banners: parsed.banners || [],
                    loyaltySettings: parsed.loyaltySettings || state.loyaltySettings
                };
                saveDatabase();
                showToast('Backup restored successfully.');
                e.target.value = '';
                render();
            };
            reader.onerror = () => showToast('Could not read that file.', 'error');
            reader.readAsText(file);
        }

            openModal(content, 'max-w-md');
        }

        // Flipkart-style category icons, mapped loosely by keyword. Falls back to a generic icon.
        const CATEGORY_ICON_MAP = [
            { keys: ['fashion', 'cloth', 'wear', 'apparel'], icon: 'fa-shirt', color: 'text-pink-500' },
            { keys: ['mobile', 'phone'], icon: 'fa-mobile-screen-button', color: 'text-sky-500' },
            { keys: ['electronic', 'laptop', 'computer', 'gadget'], icon: 'fa-laptop', color: 'text-indigo-500' },
            { keys: ['beauty', 'cosmetic', 'makeup'], icon: 'fa-spray-can-sparkles', color: 'text-rose-500' },
            { keys: ['home', 'furniture', 'kitchen'], icon: 'fa-couch', color: 'text-amber-600' },
            { keys: ['grocery', 'food', 'snack'], icon: 'fa-basket-shopping', color: 'text-emerald-500' },
            { keys: ['stationary', 'stationery', 'book', 'pen', 'paper'], icon: 'fa-pen-ruler', color: 'text-orange-500' },
            { keys: ['toy', 'kid', 'baby'], icon: 'fa-shapes', color: 'text-purple-500' },
            { keys: ['sport', 'fitness'], icon: 'fa-dumbbell', color: 'text-red-500' },
            { keys: ['appliance'], icon: 'fa-blender', color: 'text-cyan-600' },
        ];
        function getCategoryIcon(catName) {
            const lower = (catName || '').toLowerCase();
            if (lower === 'all') return { icon: 'fa-border-all', color: 'text-slate-600' };
            const match = CATEGORY_ICON_MAP.find(c => c.keys.some(k => lower.includes(k)));
            return match ? { icon: match.icon, color: match.color } : { icon: 'fa-tag', color: 'text-slate-500' };
        }

        function renderFlipkartStyleHeader() {
            return `
                <header class="bg-gradient-to-b from-orange-500 to-amber-400 text-white sticky top-0 z-30 shadow-md pb-3">

                                <h1 class="font-black text-base leading-tight truncate">${state.shopDetails.name}</h1>
                            </div>

                                <button onclick="setUserTab('profile')" class="flex items-center gap-1 bg-white/95 hover:bg-white text-amber-600 transition rounded-full pl-1 pr-2.5 py-1 shadow-sm" title="Reward Coins">
                                    <span class="w-5 h-5 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-white text-[10px] flex-shrink-0"><i class="fas fa-coins"></i></span>
                                    <span class="text-xs font-black">${state.currentUser.loyaltyPoints || 0}</span>
                                </button>
                                <button onclick="toggleDarkModeAndRender()" class="text-white/90 hover:text-white transition" title="Toggle Dark Mode">
                                    <i class="fas ${state.darkMode ? 'fa-sun' : 'fa-moon'}"></i>
                                </button>
                                <button onclick="getUserLocation()" class="text-white/90 hover:text-white transition" title="Update Location">
                                    <i class="fas fa-location-arrow"></i>
                                </button>
                                <button onclick="logout()" class="text-white/90 hover:text-white transition" title="Logout">
                                    <i class="fas fa-sign-out-alt"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Search Bar -->
                        <div class="relative">
                            <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <input type="text" oninput="handleUserSearch(this.value)" placeholder="Search for products..." class="w-full pl-10 pr-4 py-3 bg-white text-slate-800 shadow-sm rounded-xl focus:ring-2 focus:ring-white outline-none font-medium text-sm">
                        </div>

                        <!-- Location strip -->
                        <button onclick="getUserLocation()" class="flex items-center gap-1.5 mt-2 text-[11px] font-semibold text-white/90 hover:text-white transition truncate max-w-full">
                            <i class="fas fa-location-dot"></i>

        function renderCategoryIconStrip(categories) {
            const activeCat = state.selectedCategory || 'All';
            return `
                <div id="user-category-strip" class="flex gap-4 overflow-x-auto pb-2 mb-5 scrollbar-hide -mx-4 px-4 md:mx-0 md:px-0">
                    ${categories.map(cat => {
                        const { icon, color } = getCategoryIcon(cat);
                        const isActive = activeCat === cat;
                        // Prefer a real product photo from that category so each category
                        // shows a distinct image; fall back to the generic icon if none.
                        const catImg = cat !== 'All' ? (state.products.find(p => p.category === cat && p.img) || {}).img : null;
                        return `
                        <button onclick="setCategoryFilter('${cat}')" class="flex flex-col items-center flex-shrink-0 w-16 group">
                            <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-xl bg-white shadow-sm border transition-all overflow-hidden ${isActive ? 'border-amber-400 ring-2 ring-amber-300' : 'border-slate-200'} group-hover:scale-105">
                                ${catImg ? `<img src="${catImg}" class="w-full h-full object-cover mix-blend-multiply">` : `<i class="fas ${icon} ${color}"></i>`}
                            </div>
                            <span class="text-[10px] font-bold mt-1 text-center truncate w-full ${isActive ? 'text-amber-600' : 'text-slate-600'}">${cat}</span>

                </div>

        function renderPromoBanner() {
            const slides = getBannerSlides();
            return `
                <div class="mb-6 -mx-4 md:mx-0 md:rounded-2xl overflow-hidden relative shadow-md group/banner" ontouchstart="bannerTouchStart(event)" ontouchend="bannerTouchEnd(event)">
                    <div id="banner-track" class="flex">
                        ${slides.map(s => `
                            <div onclick="handleBannerTap('${s.category || ''}')" class="w-full flex-shrink-0 cursor-pointer ${s.img ? '' : `bg-gradient-to-r ${s.gradient}`} text-white p-6 relative min-h-[220px] sm:min-h-[280px] flex items-center overflow-hidden">
                                ${s.img ? `<img src="${s.img}" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-black/40"></div>` : ''}
                                <div class="relative z-10 max-w-[70%]">
                                    <div class="text-xs font-black uppercase tracking-widest text-amber-200 mb-2">${s.badge}</div>
                                    <div class="text-2xl sm:text-3xl font-black leading-tight mb-2">${s.title}</div>
                                    <div class="text-sm font-semibold text-white/80">${s.sub}</div>
                                </div>
                                ${s.icon ? `<i class="fas ${s.icon} absolute right-4 top-1/2 -translate-y-1/2 text-8xl sm:text-9xl text-white/15"></i>` : ''}
                            </div>
                        `).join('')}
                    </div>
                    ${slides.length > 1 ? `
                        <button onclick="event.stopPropagation(); bannerPrev()" aria-label="Previous banner" class="no-print absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/30 hover:bg-black/50 text-white flex items-center justify-center transition z-20">
                            <i class="fas fa-chevron-left text-sm"></i>
                        </button>
                        <button onclick="event.stopPropagation(); bannerNext()" aria-label="Next banner" class="no-print absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/30 hover:bg-black/50 text-white flex items-center justify-center transition z-20">
                            <i class="fas fa-chevron-right text-sm"></i>
                        </button>
                        <div class="absolute bottom-3 left-0 w-full flex justify-center gap-1.5">
                            ${slides.map((_, i) => `<button onclick="event.stopPropagation(); goToBanner(${i})" class="banner-dot h-1.5 rounded-full transition-all ${i === 0 ? 'w-5 bg-white' : 'w-1.5 bg-white/50'}"></button>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Simple always-on reminder while the cart has items and the customer is browsing
        // the catalog instead of checking out — nudges them back to finish the order.
        function renderCartReminderBanner() {
            if (!state.cart || state.cart.length === 0) return '';
            const count = state.cart.reduce((acc, i) => acc + i.qty, 0);
            const total = state.cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            return `
                <div class="mb-6 bg-indigo-50 border border-indigo-200 rounded-2xl p-4 flex items-center justify-between gap-3 flex-wrap">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center flex-shrink-0"><i class="fas fa-cart-shopping"></i></div>
                        <div>
                            <div class="text-sm font-black text-indigo-800">${count} item${count === 1 ? '' : 's'} waiting in your cart</div>
                            <div class="text-xs font-bold text-indigo-500">Total so far: ₹${total.toLocaleString()}</div>
                        </div>
                    </div>
                    <button onclick="setUserTab('cart')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-sm">Go to Cart <i class="fas fa-arrow-right ml-1"></i></button>
                </div>
            `;
        }

        // Tapping a banner filters the shop to the category it's linked to (if any)
        // and scrolls to the grid; otherwise falls back to just scrolling to the grid.
        function handleBannerTap(category) {
            if (category) {
                setCategoryFilter(category);
            }
            scrollToProducts();
        }

        // Auto-builds banner slides from live shop data: welcome message, active coupons, best discount, category count.
        function getBannerSlides() {
            const slides = [];
            slides.push({
                badge: `Welcome to ${state.shopDetails.name}`,
                title: state.shopDetails.description || 'Great deals, every day.',
                sub: 'Shop the latest picks below',
                gradient: 'from-indigo-600 via-purple-600 to-fuchsia-600',
                icon: 'fa-bag-shopping'
            });

            const activeCoupons = (state.coupons || []).filter(c =>
                c.active !== false && (!c.expiry || new Date(c.expiry).getTime() >= Date.now())
            ).slice(0, 3);
            activeCoupons.forEach(c => {
                slides.push({
                    badge: 'Limited Time Offer',
                    title: c.type === 'percent' ? `${c.value}% OFF` : `₹${c.value} OFF`,
                    sub: `Use code ${c.code}${c.minPurchase ? ` on ₹${c.minPurchase}+` : ''}`,
                    gradient: 'from-rose-500 via-pink-600 to-orange-500',
                    icon: 'fa-tag'
                });
            });

            const discounted = state.products.filter(p => p.qty > 0 && p.mrp > p.retailPrice);
            if (discounted.length > 0) {
                const best = discounted.reduce((a, b) =>
                    ((a.mrp - a.retailPrice) / a.mrp) > ((b.mrp - b.retailPrice) / b.mrp) ? a : b
                );
                const pct = Math.round(((best.mrp - best.retailPrice) / best.mrp) * 100);
                if (pct > 0) {
                    slides.push({
                        badge: 'Best Deal',
                        title: `Up to ${pct}% OFF`,
                        sub: best.name,
                        gradient: 'from-emerald-500 via-teal-600 to-cyan-600',
                        icon: 'fa-fire',
                        category: best.category
                    });
                }
            }

            // Admin-uploaded image banners (Admin > Banners)
            const customBanners = (state.banners || []).filter(b =>
                b.active !== false && (!b.expiry || new Date(b.expiry).getTime() >= Date.now())
            );
            customBanners.forEach(b => {
                slides.push({
                    badge: b.discount || 'Special Offer',
                    title: b.title,
                    sub: b.sub || '',
                    img: b.img,
                    category: b.linkedCategory || null
                });
            });

            // Newest in-stock product, based on most recent stock addition
            const inStock = state.products.filter(p => p.qty > 0);
            if (inStock.length > 0) {
                const latest = inStock[inStock.length - 1];
                slides.push({
                    badge: 'New Arrival',
                    title: latest.name,
                    sub: `Now available in ${latest.category || 'store'}`,
                    gradient: 'from-sky-500 via-blue-600 to-indigo-600',
                    icon: 'fa-sparkles',
                    category: latest.category
                });
            }

            const catCount = new Set(state.products.map(p => p.category)).size;
            if (catCount > 0) {
                slides.push({
                    badge: 'Explore',
                    title: `${catCount} ${catCount === 1 ? 'Category' : 'Categories'} to explore`,
                    sub: 'Find everything you need',
                    gradient: 'from-amber-500 via-orange-500 to-red-500',
                    icon: 'fa-layer-group'
                });
            }

            return slides;
        }

        // Scrolls the customer view down to the product grid when the promo banner is tapped
        function scrollToProducts() {
            const grid = document.getElementById('user-product-grid');
            if (grid) {
                grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // --- Banner carousel controls (auto-rotate + swipe, no full re-render needed) ---
        let bannerIndex = 0;
        let bannerTimer = null;
        let bannerSlideCount = 0;
        let bannerTouchStartX = null;

        function initBannerCarousel() {
            const track = document.getElementById('banner-track');
            if (!track) return;
            bannerSlideCount = track.children.length;
            if (bannerIndex >= bannerSlideCount) bannerIndex = 0;
            updateBannerPosition(false);
            startBannerTimer();
        }

        function startBannerTimer() {
            if (bannerTimer) clearInterval(bannerTimer);
            if (bannerSlideCount > 1) {
                bannerTimer = setInterval(() => {
                    bannerIndex = (bannerIndex + 1) % bannerSlideCount;
                    updateBannerPosition(true);
                }, 4000);
            }
        }

        function updateBannerPosition(animate) {
            const track = document.getElementById('banner-track');
            if (!track) return;
            track.style.transition = animate ? 'transform 0.4s ease' : 'none';
            track.style.transform = `translateX(-${bannerIndex * 100}%)`;
            document.querySelectorAll('.banner-dot').forEach((dot, i) => {
                dot.classList.toggle('w-5', i === bannerIndex);
                dot.classList.toggle('bg-white', i === bannerIndex);
                dot.classList.toggle('w-1.5', i !== bannerIndex);
                dot.classList.toggle('bg-white/50', i !== bannerIndex);
            });
        }

        function goToBanner(i) {
            bannerIndex = i;
            updateBannerPosition(true);
            startBannerTimer();
        }

        function bannerNext() {
            if (bannerSlideCount <= 1) return;
            bannerIndex = (bannerIndex + 1) % bannerSlideCount;
            updateBannerPosition(true);
            startBannerTimer();
        }

        function bannerPrev() {
            if (bannerSlideCount <= 1) return;
            bannerIndex = (bannerIndex - 1 + bannerSlideCount) % bannerSlideCount;
            updateBannerPosition(true);
            startBannerTimer();
        }

        function bannerTouchStart(e) {
            bannerTouchStartX = e.touches[0].clientX;
            if (bannerTimer) clearInterval(bannerTimer);
        }

        function bannerTouchEnd(e) {
            if (bannerTouchStartX === null) return;
            const dx = e.changedTouches[0].clientX - bannerTouchStartX;
            if (Math.abs(dx) > 40 && bannerSlideCount > 1) {
                if (dx < 0) bannerIndex = (bannerIndex + 1) % bannerSlideCount;
                else bannerIndex = (bannerIndex - 1 + bannerSlideCount) % bannerSlideCount;
                updateBannerPosition(true);
            }
            bannerTouchStartX = null;
            startBannerTimer();
        }

        // Pulls unique in-stock products the current customer has ordered before,
        // most recent first, for a one-tap "Buy Again" reorder strip.
        function getBuyAgainProducts(limit = 10) {
            if (!state.currentUser) return [];
            const myOrders = state.orders.filter(o => o.customerId === state.currentUser.id && o.status !== 'Canceled');
            const seen = new Set();
            const results = [];
            [...myOrders].reverse().forEach(o => {
                (o.items || []).forEach(item => {
                    if (seen.has(item.id)) return;
                    const product = state.products.find(p => p.id === item.id);
                    if (product && product.qty > 0) {
                        seen.add(item.id);
                        results.push(product);
                    }
                });
            });
            return results.slice(0, limit);
        }

        function renderBuyAgainStrip() {
            const products = getBuyAgainProducts();
            if (products.length === 0) return '';
            return `
                <div class="mb-6">
                    <h3 class="font-black text-slate-800 text-sm uppercase tracking-wide mb-3"><i class="fas fa-rotate-right text-indigo-500 mr-1.5"></i>Buy Again</h3>
                    <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide -mx-4 px-4 md:mx-0 md:px-0">
                        ${products.map(p => {
                            const inCart = state.cart.find(item => item.id === p.id);
                            return `
                            <div class="flex-shrink-0 w-32 bg-white rounded-xl border border-slate-200 shadow-sm p-2.5">
                                <button onclick="openProductQuickView('${p.id}')" class="block w-full text-left">
                                    <div class="h-20 bg-slate-50 rounded-lg mb-2 flex items-center justify-center overflow-hidden p-1">
                                        <img src="${p.img || 'https://placehold.co/200x200/e2e8f0/64748b?text=Img'}" class="max-h-full object-contain mix-blend-multiply">
                                    </div>
                                    <div class="text-[9px] font-bold text-slate-400 uppercase tracking-wider truncate">${p.category}</div>
                                    <div class="text-xs font-bold text-slate-700 truncate leading-tight">${p.name}</div>
                                    <div class="font-black text-indigo-600 text-xs mt-1">₹${p.retailPrice}</div>
                                </button>
                                ${inCart ? `
                                    <div class="flex items-center justify-between bg-indigo-50 rounded-lg p-1 border border-indigo-100 mt-2">
                                        <button onclick="updateCartQty('${p.id}', -1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow-sm text-indigo-600 font-black text-xs hover:bg-indigo-100 transition">-</button>
                                        <span class="font-black text-indigo-800 text-xs">${inCart.qty}</span>
                                        <button onclick="updateCartQty('${p.id}', 1)" class="w-6 h-6 flex items-center justify-center bg-indigo-600 rounded shadow-sm text-white font-black text-xs hover:bg-indigo-700 transition">+</button>
                                    </div>
                                ` : `
                                    <button onclick="addToCart('${p.id}')" class="w-full mt-2 bg-slate-900 text-white font-bold py-1.5 rounded-lg hover:bg-indigo-600 transition text-[10px]">Add to Cart</button>
                                `}
                            </div>
                        `}).join('')}
                    </div>
                </div>
            `;
        }

        function renderRecommendedStrip(products) {
            if (!products || products.length === 0) return '';
            return `
                <div class="mb-6">
                    <h3 class="font-black text-slate-800 text-sm uppercase tracking-wide mb-3">Still looking for these?</h3>
                    <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide -mx-4 px-4 md:mx-0 md:px-0">
                        ${products.map(p => `
                            <button onclick="setCategoryFilter('${p.category}')" class="flex-shrink-0 w-28 bg-white rounded-xl border border-slate-200 shadow-sm p-2 text-left hover:shadow-md transition">
                                <div class="h-20 bg-slate-50 rounded-lg mb-2 flex items-center justify-center overflow-hidden p-1">
                                    <img src="${p.img || 'https://placehold.co/200x200/e2e8f0/64748b?text=Img'}" class="max-h-full object-contain mix-blend-multiply">
                                </div>
                                <div class="text-[10px] font-bold text-slate-600 truncate">${p.category}</div>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Scrolling marquee strip of currently active/running coupons, shown at the
        // top of the customer dashboard so offers are always visible.
        function renderCouponMarquee() {
            const activeCoupons = (state.coupons || []).filter(c =>
                c.active !== false && (!c.expiry || new Date(c.expiry).getTime() >= Date.now())
            );
            if (!activeCoupons.length) return '';

                    </aside>

                    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
                        <!-- Header (mobile only; desktop nav lives in the sidebar) -->
                        ${state.currentUserTab === 'catalog' ? renderFlipkartStyleHeader() : `
                        <header class="lg:hidden bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-30">
                            <div class="max-w-5xl mx-auto flex justify-between items-center">
                                <div class="flex items-center gap-3">
                                    ${state.shopDetails.img ? `<img src="${state.shopDetails.img}" class="w-10 h-10 rounded-full bg-white object-cover border-2 border-indigo-400 p-0.5">` : '<div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center text-xl"><i class="fas fa-store"></i></div>'}
                                    <div>

                                        <span class="w-5 h-5 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-white text-[10px] flex-shrink-0"><i class="fas fa-coins"></i></span>

        function renderOrderTimeline(status) {
            if (status === 'Canceled') {
                return `<div class="flex items-center gap-2 text-rose-600 text-xs font-black bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"><i class="fas fa-circle-xmark"></i> This order was canceled.</div>`;
            }
            if (status === 'Return Requested') {
                return `<div class="flex items-center gap-2 text-orange-600 text-xs font-black bg-orange-50 border border-orange-200 rounded-lg px-3 py-2"><i class="fas fa-rotate-left"></i> Return requested — awaiting store review.</div>`;
            }
            if (status === 'Refunded') {
                return `<div class="flex items-center gap-2 text-slate-600 text-xs font-black bg-slate-100 border border-slate-200 rounded-lg px-3 py-2"><i class="fas fa-circle-check"></i> This order was refunded.</div>`;
            }
            const steps = [
                { key: 'Progress', label: 'Order Placed', icon: 'fa-receipt' },
                { key: 'Order Confirmed', label: 'Confirmed', icon: 'fa-box' },
                { key: 'Packed', label: 'Packed', icon: 'fa-box-open' },
                { key: 'Out for Delivery', label: 'Out for Delivery', icon: 'fa-truck' },
                { key: 'Delivered', label: 'Delivered', icon: 'fa-house-circle-check' }
            ];
            const order = ['Progress', 'Order Confirmed', 'Packed', 'Out for Delivery', 'Delivered'];
            const currentIdx = Math.max(0, order.indexOf(status || 'Progress'));
            return `
                <div class="flex items-center w-full py-2">
                    ${steps.map((s, i) => `
                        <div class="flex items-center ${i < steps.length - 1 ? 'flex-1' : ''}">
                            <div class="flex flex-col items-center">
                                <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs ${i <= currentIdx ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-400 border border-slate-200'}">
                                    <i class="fas ${s.icon}"></i>
                                </div>
                                <div class="text-[9px] font-bold mt-1 text-center w-16 ${i <= currentIdx ? 'text-indigo-600' : 'text-slate-400'}">${s.label}</div>
                            </div>
                            ${i < steps.length - 1 ? `<div class="flex-1 h-1 mx-1 rounded ${i < currentIdx ? 'bg-indigo-600' : 'bg-slate-100'}"></div>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function setUserTab(tab) {
            state.currentUserTab = tab;
            if (tab === 'cart') autoApplyBestCoupon();
            render();
        }

        function renderCouponBanner() {
            const activeCoupons = (state.coupons || []).filter(c =>
                c.active !== false && (!c.expiry || new Date(c.expiry).getTime() >= Date.now())
            );
            if (activeCoupons.length === 0) return '';

            return `
                <div class="mb-6 -mx-4 px-4 md:mx-0 md:px-0">
                    <div class="flex gap-3 overflow-x-auto pb-1 scrollbar-hide">
                        ${activeCoupons.map(c => `
                            <button onclick="copyCouponCode('${c.code}')" class="flex-shrink-0 flex items-center gap-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl px-4 py-3 shadow-md shadow-indigo-200 hover:scale-[1.02] transition-transform text-left">
                                <i class="fas fa-tag text-lg opacity-90"></i>
                                <div>
                                    <div class="font-black text-sm leading-tight">
                                        ${c.type === 'percent' ? `${c.value}% OFF` : `₹${c.value} OFF`}
                                        ${c.minPurchase ? `<span class="font-semibold opacity-90"> on ₹${c.minPurchase}+</span>` : ''}
                                    </div>
                                    <div class="text-[11px] font-mono font-bold tracking-wide opacity-90">Code: ${c.code}</div>
                                </div>
                                <i class="fas fa-copy text-xs opacity-75 ml-1"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function copyCouponCode(code) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(() => {
                    showToast(`Coupon "${code}" copied!`);
                }).catch(() => {
                    showToast(`Coupon code: ${code}`, 'info');
                });
            } else {
                showToast(`Coupon code: ${code}`, 'info');
            }
        }

        function getUserTabContent() {
            switch(state.currentUserTab) {
                case 'catalog':
                    const categories = ['All', ...new Set(state.products.map(p => p.category))];
                    const activeCat = state.selectedCategory || 'All';
                    const availableProducts = state.products.filter(p => p.qty > 0);
                    const filteredProducts = availableProducts.filter(p => activeCat === 'All' || p.category === activeCat);
                    const wishlistProducts = state.products.filter(p => (state.currentUser.wishlist || []).includes(p.id));
                    const recommendedStripProducts = (wishlistProducts.length > 0 ? wishlistProducts : availableProducts).slice(0, 8);

                    return `
                        <!-- Category Icons (Flipkart-style) -->
                        ${renderCategoryIconStrip(categories)}

                        <!-- Promo Banner -->
                        ${renderPromoBanner()}

                        <!-- Cart reminder -->
                        ${renderCartReminderBanner()}

                        <!-- You may like -->

                        ${renderSortFilterBar()}
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="user-product-grid">
                            ${renderUserProductGrid(applySortAndFilter(filteredProducts))}

                case 'wishlist':
                    const wishIds = state.currentUser.wishlist || [];
                    const wishProducts = state.products.filter(p => wishIds.includes(p.id));
                    return `
                        <h2 class="text-2xl font-black text-slate-800 mb-6">My Wishlist</h2>
                        ${wishProducts.length === 0 ? `

                                ${renderUserProductGrid(wishProducts)}
                            </div>

                    `;

                case 'cart':
                    const subtotal = state.cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
                    
                    // Calculate dynamic delivery fee based on rules
                    state.checkoutDeliveryFee = calculateDeliveryFee(subtotal);
                    const isDeliveryFree = subtotal > 0 && state.checkoutDeliveryFee === 0 && state.deliveryFeeRules.length > 0;
                    
                    let couponDiscount = 0;
                    if (state.appliedCoupon) {
                        couponDiscount = state.appliedCoupon.type === 'percent'
                            ? Math.round(subtotal * (state.appliedCoupon.value / 100))
                            : state.appliedCoupon.value;
                        couponDiscount = Math.min(couponDiscount, subtotal);
                    }
                    const userLoyaltyPoints = state.currentUser.loyaltyPoints || 0;
                    const loyaltyPointsValue = loyaltyPointsValueInRupees(userLoyaltyPoints);
                    const payableBeforeLoyalty = Math.max(0, subtotal + state.checkoutDeliveryFee - couponDiscount);
                    const loyaltyMaxRedeemable = loyaltyMaxRedeemableRupees(payableBeforeLoyalty);
                    const loyaltyDiscount = state.useLoyaltyPoints ? Math.min(loyaltyPointsValue, payableBeforeLoyalty, loyaltyMaxRedeemable) : 0;
                    const total = Math.max(0, payableBeforeLoyalty - loyaltyDiscount);

                    return `
                        <h2 class="text-2xl font-black text-slate-800 mb-6">Shopping Cart</h2>
                        ${state.cart.length === 0 ? `

                                <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-4"><i class="fas fa-shopping-basket text-4xl text-slate-300"></i></div>

                            </div>
                        ` : `
                            <div class="flex flex-col lg:flex-row gap-6">
                                <div class="flex-1 space-y-4">
                                    ${state.cart.map(item => `
                                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4 group">
                                            <div class="w-20 h-20 bg-slate-50 rounded-xl overflow-hidden flex items-center justify-center p-1 border border-slate-100 shrink-0">
                                                <img src="${item.img || 'https://placehold.co/100x100'}" class="max-h-full object-contain mix-blend-multiply">
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <div class="text-[10px] font-bold text-indigo-500 uppercase tracking-wider">${item.category}</div>
                                                <h4 class="font-bold text-slate-800 truncate leading-tight">${item.name}</h4>
                                                <div class="font-black text-slate-800 mt-1">₹${item.price} <span class="text-xs text-slate-400 font-normal line-through ml-1">₹${item.mrp}</span></div>
                                            </div>
                                            <div class="flex flex-col items-end gap-2">
                                                <button onclick="removeFromCart('${item.id}')" class="text-slate-300 hover:text-rose-500 transition"><i class="fas fa-trash-alt"></i></button>
                                                <div class="flex items-center gap-2 bg-slate-50 rounded-lg p-1 border border-slate-200">
                                                    <button onclick="updateCartQty('${item.id}', -1)" class="w-7 h-7 flex items-center justify-center bg-white rounded shadow-sm hover:text-rose-500 text-slate-600 font-bold">-</button>
                                                    <span class="w-6 text-center font-black text-sm text-slate-800">${item.qty}</span>
                                                    <button onclick="updateCartQty('${item.id}', 1)" class="w-7 h-7 flex items-center justify-center bg-white rounded shadow-sm hover:text-emerald-500 text-slate-600 font-bold">+</button>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}

                                <div class="lg:w-80">
                                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 sticky top-24">
                                        <h3 class="font-black text-slate-800 mb-4 border-b pb-2">Order Summary</h3>
                                        
                                        <!-- Payment Method Selection Add-On -->
                                        <div class="mb-4 border-b border-slate-100 pb-4">

                                                <label class="flex items-center p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition ${!state.selectedPaymentMethod || state.selectedPaymentMethod === 'Cash on Delivery' ? 'border-indigo-500 bg-indigo-50/30' : ''}">
                                                    <input type="radio" name="paymentMethod" value="Cash on Delivery" class="mr-3 accent-indigo-600" onchange="updatePaymentMethod(this.value)" ${!state.selectedPaymentMethod || state.selectedPaymentMethod === 'Cash on Delivery' ? 'checked' : ''}>

                                                <label class="flex items-center p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition ${state.selectedPaymentMethod === 'Online Payment / UPI' ? 'border-indigo-500 bg-indigo-50/30' : ''}">

                                                                <button type="button" onclick="payViaUpi('PhonePe', ${total})" class="flex items-center justify-center gap-2 p-2.5 rounded-xl border border-slate-200 hover:bg-purple-50 hover:border-purple-300 transition font-bold text-xs text-slate-700">
                                                                    <i class="fas fa-mobile-screen-button text-purple-600"></i> PhonePe
                                                                </button>
                                                                <button type="button" onclick="payViaUpi('Paytm', ${total})" class="flex items-center justify-center gap-2 p-2.5 rounded-xl border border-slate-200 hover:bg-blue-50 hover:border-blue-300 transition font-bold text-xs text-slate-700">
                                                                    <i class="fas fa-wallet text-blue-600"></i> Paytm

                                ${renderAccountMenuItem('fa-user', 'My Profile', 'openMyProfileModal()')}

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            document.body.classList.toggle('dark-mode', state.darkMode);
            localStorage.setItem('retailAppDarkMode', state.darkMode ? '1' : '0');
        }

        function toggleDarkModeAndRender() {
            toggleDarkMode();
            render();
        }

        function toggleLoyaltyRedeem() {
            state.useLoyaltyPoints = !state.useLoyaltyPoints;
            render();
        }

        function updatePaymentMethod(method) {
            state.selectedPaymentMethod = method;
            state.selectedUpiApp = null;
            render(); // Re-render to show selected style
        }

        function payViaUpi(app, amount) {
            const upiId = state.shopDetails.upiId;
            if (!upiId) {
                showToast('Shop UPI ID is not configured.', 'error');
                return;
            }
            const payeeName = encodeURIComponent(state.shopDetails.name || 'Shop');
            const note = encodeURIComponent(`Order payment - ${state.shopDetails.name || 'Shop'}`);
            // Standard UPI deep link - opens the installed UPI app chooser (PhonePe, Paytm, GPay, etc.) on mobile devices.
            const upiLink = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${payeeName}&am=${amount}&cu=INR&tn=${note}`;
            state.selectedUpiApp = app;
            window.location.href = upiLink;
            render();
        }

        // Opens a quick-view modal for a single product — used when a customer taps
        // a banner that's linked to a specific product.
        function openProductQuickView(productId) {
            const p = state.products.find(pr => pr.id === productId);
            if (!p) { scrollToProducts(); return; }

            const inCart = state.cart.find(item => item.id === p.id);
            const inWishlist = (state.currentUser.wishlist || []).includes(p.id);
            const rt = getProductRating(p.id);
            const outOfStock = p.qty <= 0;

            const content = `
                <div class="flex justify-between items-start mb-4">
                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${p.category}</div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800"><i class="fas fa-times"></i></button>
                </div>
                <div class="h-44 bg-slate-50 rounded-xl mb-4 flex items-center justify-center overflow-hidden p-2 relative">
                    <img src="${p.img || 'https://placehold.co/300x300/e2e8f0/64748b?text=Img'}" class="max-h-full object-contain mix-blend-multiply">
                    ${p.mrp > p.retailPrice ? `<div class="absolute top-2 left-2 bg-rose-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider">${Math.round(((p.mrp-p.retailPrice)/p.mrp)*100)}% OFF</div>` : ''}
                    <button onclick="toggleWishlist('${p.id}'); openProductQuickView('${p.id}')" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 shadow-sm flex items-center justify-center hover:scale-110 transition" title="Wishlist">
                        <i class="fas fa-heart text-sm ${inWishlist ? 'text-rose-500' : 'text-slate-300'}"></i>
                    </button>
                </div>
                <h3 class="text-lg font-black text-slate-800 leading-tight mb-1">${p.name}</h3>
                ${rt.count ? `<div class="flex items-center gap-1 mb-2">${renderStars(rt.avg, 'text-xs')}<span class="text-[11px] text-slate-400 font-bold">(${rt.count} review${rt.count === 1 ? '' : 's'})</span></div>` : ''}
                <div class="flex items-end gap-2 mb-4">
                    <div class="font-black text-indigo-600 text-2xl">₹${p.retailPrice}</div>
                    ${p.mrp > p.retailPrice ? `<div class="text-sm text-slate-400 line-through mb-0.5">₹${p.mrp}</div>` : ''}
                </div>
                ${outOfStock ? `
                    <div class="w-full bg-slate-100 text-slate-400 font-bold py-3 rounded-xl text-center text-sm">Out of Stock</div>
                ` : inCart ? `
                    <div class="flex items-center justify-between bg-indigo-50 rounded-xl p-1.5 border border-indigo-100">
                        <button onclick="updateCartQty('${p.id}', -1); openProductQuickView('${p.id}')" class="w-10 h-10 flex items-center justify-center bg-white rounded-lg shadow-sm text-indigo-600 font-black hover:bg-indigo-100 transition">-</button>
                        <span class="font-black text-indigo-800">${inCart.qty}</span>
                        <button onclick="updateCartQty('${p.id}', 1); openProductQuickView('${p.id}')" class="w-10 h-10 flex items-center justify-center bg-indigo-600 rounded-lg shadow-sm text-white font-black hover:bg-indigo-700 transition">+</button>
                    </div>
                ` : `
                    <button onclick="addToCart('${p.id}'); openProductQuickView('${p.id}')" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-indigo-600 transition text-sm shadow-md">
                        Add to Cart
                    </button>
                `}
                <button onclick="closeModal(); setCategoryFilter('${p.category}'); scrollToProducts()" class="w-full mt-3 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl hover:bg-slate-200 transition text-sm">
                    See more in ${p.category}
                </button>
            `;
            openModal(content, 'max-w-sm');
        }

        function renderUserProductGrid(products) {
            if(products.length === 0) return '<div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-2xl border border-slate-200 font-medium">No products match your search.</div>';
            
            return products.map(p => {
                const inCart = state.cart.find(item => item.id === p.id);
                
                return `
                <div class="bg-white p-3 md:p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col group hover:shadow-md transition">
                    <div class="h-28 md:h-36 bg-slate-50 rounded-xl mb-3 flex items-center justify-center overflow-hidden p-2 relative">
                        <img src="${p.img || 'https://placehold.co/200x200/e2e8f0/64748b?text=Img'}" class="max-h-full object-contain mix-blend-multiply group-hover:scale-105 transition duration-300">
                        ${p.mrp > p.retailPrice ? `<div class="absolute top-2 left-2 bg-rose-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider">${Math.round(((p.mrp-p.retailPrice)/p.mrp)*100)}% OFF</div>` : ''}
                        <button onclick="toggleWishlist('${p.id}')" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/90 shadow-sm flex items-center justify-center hover:scale-110 transition" title="Wishlist">
                            <i class="fas fa-heart text-xs ${(state.currentUser.wishlist||[]).includes(p.id) ? 'text-rose-500' : 'text-slate-300'}"></i>
                        </button>
                    </div>
                    <div class="text-[9px] font-bold text-slate-400 uppercase tracking-wider truncate">${p.category}</div>
                    <h5 class="font-bold text-slate-800 text-sm md:text-base leading-tight mb-1 flex-1 line-clamp-2">${p.name}</h5>
                    ${(() => { const rt = getProductRating(p.id); return rt.count ? `<div class="flex items-center gap-1 mb-2">${renderStars(rt.avg, 'text-[10px]')}<span class="text-[9px] text-slate-400 font-bold">(${rt.count})</span></div>` : ''; })()}
                    
                    <div class="flex items-end justify-between mb-3">
                        <div>
                            <div class="font-black text-indigo-600 text-base md:text-lg">₹${p.retailPrice}</div>
                            ${p.mrp > p.retailPrice ? `<div class="text-xs text-slate-400 line-through">₹${p.mrp}</div>` : ''}
                        </div>
                    </div>
                    
                    ${inCart ? `
                        <div class="flex items-center justify-between bg-indigo-50 rounded-xl p-1 border border-indigo-100 mt-auto">
                            <button onclick="updateCartQty('${p.id}', -1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg shadow-sm text-indigo-600 font-black hover:bg-indigo-100 transition">-</button>
                            <span class="font-black text-indigo-800">${inCart.qty}</span>
                            <button onclick="updateCartQty('${p.id}', 1)" class="w-8 h-8 flex items-center justify-center bg-indigo-600 rounded-lg shadow-sm text-white font-black hover:bg-indigo-700 transition">+</button>
                        </div>
                    ` : `
                        <button onclick="addToCart('${p.id}')" class="w-full bg-slate-900 text-white font-bold py-2 md:py-2.5 rounded-xl hover:bg-indigo-600 transition text-xs md:text-sm shadow-md mt-auto">
                            Add to Cart
                        </button>
                    `}
                </div>
            `}).join('');
        }

        function toggleWishlist(productId) {
            if (!state.currentUser.wishlist) state.currentUser.wishlist = [];
            const idx = state.currentUser.wishlist.indexOf(productId);
            if (idx > -1) state.currentUser.wishlist.splice(idx, 1);
            else state.currentUser.wishlist.push(productId);
            const userIndex = state.users.findIndex(u => u.id === state.currentUser.id);
            if (userIndex > -1) state.users[userIndex].wishlist = state.currentUser.wishlist;
            saveDatabase();
            render();
        }

        function handleUserSearch(term) {
            const availableProducts = state.products.filter(p => p.qty > 0);
            const filtered = availableProducts.filter(p => 
                p.name.toLowerCase().includes(term.toLowerCase()) || 
                p.category.toLowerCase().includes(term.toLowerCase())
            );
            document.getElementById('user-product-grid').innerHTML = renderUserProductGrid(applySortAndFilter(filtered));
        }

        function addToCart(productId) {
            const product = state.products.find(p => p.id === productId);
            if(product && product.qty > 0) {
                state.cart.push({ ...product, qty: 1, price: product.retailPrice }); // Force retail price for user app
                state.couponAutoDismissed = false; // give auto-apply a fresh chance since the cart changed
                autoApplyBestCoupon();
                showToast(`Added ${product.name} to cart.`);
                render();
            }
        }

        function updateCartQty(productId, change) {
            const itemIndex = state.cart.findIndex(item => item.id === productId);
            if (itemIndex > -1) {
                const item = state.cart[itemIndex];
                const product = state.products.find(p => p.id === productId);
                
                let newQty = item.qty + change;
                if (newQty > product.qty) {
                    showToast('Maximum available stock reached.', 'info');
                    newQty = product.qty;
                }
                
                if (newQty <= 0) {
                    state.cart.splice(itemIndex, 1);
                } else {
                    item.qty = newQty;
                }
                state.couponAutoDismissed = false;
                autoApplyBestCoupon();
                render();
            }
        }

        function removeFromCart(productId) {
            state.cart = state.cart.filter(item => item.id !== productId);
            state.couponAutoDismissed = false;
            autoApplyBestCoupon();
            render();
        }

        function renderStars(rating, size = 'text-sm') {
            const r = Math.round(rating || 0);
            let out = '';
            for (let i = 1; i <= 5; i++) {
                out += `<i class="fas fa-star ${size} ${i <= r ? 'text-amber-400' : 'text-slate-200'}"></i>`;
            }
            return out;
        }

        function getProductRating(productId) {
            const revs = state.reviews.filter(r => r.productId === productId);
            if (!revs.length) return { avg: 0, count: 0 };
            const avg = revs.reduce((acc, r) => acc + r.rating, 0) / revs.length;
            return { avg, count: revs.length };
        }

        function openReviewModal(orderId, productId) {
            const order = state.orders.find(o => o.id === orderId);

            const existing = state.reviews.find(r => r.orderId === orderId && r.productId === productId);

                <form onsubmit="submitReview(event, '${orderId}', '${productId}')">
                    <div class="flex gap-1 justify-center mb-4 text-2xl" id="review-star-input">
                        ${[1,2,3,4,5].map(n => `<i class="fas fa-star cursor-pointer ${existing && n <= existing.rating ? 'text-amber-400' : 'text-slate-200'}" data-val="${n}" onclick="setReviewStars(${n})"></i>`).join('')}
                    </div>
                    <input type="hidden" id="review-rating-value" value="${existing ? existing.rating : 5}">
                    <textarea id="review-comment" rows="3" placeholder="Optional comment..." class="w-full border-slate-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 border outline-none text-sm mb-4">${existing ? existing.comment : ''}</textarea>

                        <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl hover:bg-slate-200 transition">Cancel</button>
                        <button type="submit" class="flex-1 bg-indigo-600 text-white font-bold py-2.5 rounded-xl hover:bg-indigo-700 transition">Submit</button>

            openModal(content, 'max-w-sm');

        function setReviewStars(n) {
            document.getElementById('review-rating-value').value = n;
            document.querySelectorAll('#review-star-input i').forEach(star => {
                const val = parseInt(star.getAttribute('data-val'));
                star.classList.toggle('text-amber-400', val <= n);
                star.classList.toggle('text-slate-200', val > n);
            });
        }

        function submitReview(e, orderId, productId) {
            e.preventDefault();
            const rating = parseInt(document.getElementById('review-rating-value').value) || 5;
            const comment = document.getElementById('review-comment').value.trim();
            const existingIdx = state.reviews.findIndex(r => r.orderId === orderId && r.productId === productId);
            const reviewObj = {
                id: existingIdx > -1 ? state.reviews[existingIdx].id : generateId('REV'),
                orderId, productId,
                customerId: state.currentUser.id,
                customerName: state.currentUser.name,
                rating, comment,
                date: new Date().toISOString()
            };
            if (existingIdx > -1) state.reviews[existingIdx] = reviewObj;
            else state.reviews.push(reviewObj);
            saveDatabase();
            closeModal();
            showToast('Thanks for your review!');
            render();
        }

        function addAddress(e) {
            e.preventDefault();
            const label = document.getElementById('addr-label').value.trim();
            const address = document.getElementById('addr-text').value.trim();
            if (!label || !address) return;
            if (!state.currentUser.addresses) state.currentUser.addresses = [];
            const isFirst = state.currentUser.addresses.length === 0;
            state.currentUser.addresses.push({ label, address, isDefault: isFirst });
            // The default saved address is what checkout actually ships to (state.currentUser.address),
            // so the first address a customer saves becomes their active delivery address too.
            if (isFirst) state.currentUser.address = address;
            const idx = state.users.findIndex(u => u.id === state.currentUser.id);
            if (idx > -1) { state.users[idx].addresses = state.currentUser.addresses; state.users[idx].address = state.currentUser.address; }
            saveDatabase();
            showToast('Address added.');
            openAddressBookModal();
        }

        function setDefaultAddress(i) {
            (state.currentUser.addresses || []).forEach((a, idx) => a.isDefault = idx === i);
            const picked = (state.currentUser.addresses || [])[i];
            if (picked) state.currentUser.address = picked.address; // keep checkout's delivery address in sync with the chosen default
            const userIdx = state.users.findIndex(u => u.id === state.currentUser.id);
            if (userIdx > -1) { state.users[userIdx].addresses = state.currentUser.addresses; state.users[userIdx].address = state.currentUser.address; }
            saveDatabase();
            showToast('Default delivery address updated.');
            openAddressBookModal();
        }

        function deleteAddress(i) {
            state.currentUser.addresses.splice(i, 1);
            const userIdx = state.users.findIndex(u => u.id === state.currentUser.id);
            if (userIdx > -1) state.users[userIdx].addresses = state.currentUser.addresses;
            saveDatabase();
            openAddressBookModal();
        }
