            openModal(content, 'max-w-md');
        }

        function openRateAppModal() {
            const content = `
                <div class="text-center">
                    <h3 class="text-lg font-black text-slate-800 mb-1"><i class="fas fa-star text-amber-400 mr-1"></i>Rate Our App</h3>
                    <p class="text-sm text-slate-500 mb-4">How was your shopping experience?</p>
                    <div class="flex justify-center gap-2 mb-2">
                        ${[1, 2, 3, 4, 5].map(n => `<button onclick="submitAppRating(${n})" class="text-3xl text-amber-300 hover:text-amber-400 transition"><i class="fas fa-star"></i></button>`).join('')}
                    </div>
                </div>
            `;
            openModal(content, 'max-w-xs');
        }

        function submitAppRating(stars) {
            closeModal();
            showToast(`Thanks for rating us ${stars} star${stars === 1 ? '' : 's'}! ⭐`);
        }

        function openDeleteAccountModal() {
            const content = `
                <div class="text-center">
                    <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl"><i class="fas fa-triangle-exclamation"></i></div>
                    <h3 class="text-lg font-black text-slate-800 mb-1">Delete Account?</h3>
                    <p class="text-sm text-slate-500 mb-5">This permanently removes your account, wishlist and saved addresses. Your past order history is kept for store records. This cannot be undone.</p>
                    <div class="flex gap-3">
                        <button onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-3 rounded-xl hover:bg-slate-200 transition text-sm">Cancel</button>
                        <button onclick="confirmDeleteAccount()" class="flex-1 bg-rose-500 text-white font-bold py-3 rounded-xl hover:bg-rose-600 transition text-sm">Delete</button>
                    </div>
                </div>
            `;
            openModal(content, 'max-w-sm');
        }

        function confirmDeleteAccount() {
            const uid = state.currentUser.id;
            state.users = state.users.filter(u => u.id !== uid);
            state.cart = [];
            state.currentUser = null;
            closeModal();
            saveDatabase();
            showToast('Your account has been deleted.', 'info');
            render();
        }

        function placeOrder() {
            if(state.cart.length === 0) return;
            
            const subtotal = state.cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            
            // Recalculate delivery fee just in case
            const finalDeliveryFee = calculateDeliveryFee(subtotal);
            let finalDiscount = 0;
            if (state.appliedCoupon) {
                finalDiscount = state.appliedCoupon.type === 'percent'
                    ? Math.round(subtotal * (state.appliedCoupon.value / 100))
                    : state.appliedCoupon.value;
                finalDiscount = Math.min(finalDiscount, subtotal);
            }
            const payableBeforeLoyalty = Math.max(0, subtotal + finalDeliveryFee - finalDiscount);
            const userLoyaltyPoints = state.currentUser.loyaltyPoints || 0;
            const loyaltyPointsValue = loyaltyPointsValueInRupees(userLoyaltyPoints);
            const loyaltyMaxRedeemable = loyaltyMaxRedeemableRupees(payableBeforeLoyalty);
            const loyaltyDiscount = state.useLoyaltyPoints ? Math.min(loyaltyPointsValue, payableBeforeLoyalty, loyaltyMaxRedeemable) : 0;
            const pointsRedeemed = loyaltyDiscount > 0 ? Math.min(userLoyaltyPoints, loyaltyPointsForRupees(loyaltyDiscount)) : 0;
            const total = Math.max(0, payableBeforeLoyalty - loyaltyDiscount);
            const basePaymentMethod = state.selectedPaymentMethod || 'Cash on Delivery';
            const paymentMethod = (basePaymentMethod === 'Online Payment / UPI' && state.selectedUpiApp)
                ? `Online Payment / UPI (${state.selectedUpiApp})`
                : basePaymentMethod;

            // Earn reward points on this order per the admin-configurable Point Rules
            const pointsEarned = loyaltyEarnForAmount(total);

            const newOrder = {
                id: generateId('ORD'),
                customerId: state.currentUser.id,
                customer: state.currentUser.name,
                mobile: state.currentUser.mobile,
                address: state.currentUser.address,
                items: [...state.cart],
                subtotal: subtotal,
                deliveryFee: finalDeliveryFee,
                discount: finalDiscount,
                couponCode: state.appliedCoupon ? state.appliedCoupon.code : '',
                loyaltyDiscount: loyaltyDiscount,
                pointsRedeemed: pointsRedeemed,
                pointsEarned: pointsEarned,
                total: total,
                date: new Date().toISOString(),
                status: 'Progress',
                paymentMethod: paymentMethod,
                paymentStatus: basePaymentMethod === 'Cash on Delivery' ? 'Pending' : 'Paid',
                location: state.currentUser.location || ''
            };

            state.orders.push(newOrder);

            // Deduct stock immediately upon order placement
            state.cart.forEach(item => {
                const product = state.products.find(p => p.id === item.id);
                if(product) product.qty -= item.qty;
            });

            // Update reward points balance (redeem used points, earn new points)
            state.currentUser.loyaltyPoints = Math.max(0, userLoyaltyPoints - pointsRedeemed) + pointsEarned;
            const loyaltyUserIdx = state.users.findIndex(u => u.id === state.currentUser.id);
            if (loyaltyUserIdx !== -1) state.users[loyaltyUserIdx].loyaltyPoints = state.currentUser.loyaltyPoints;

            state.cart = [];
            state.selectedPaymentMethod = null; // Reset selection
            state.selectedUpiApp = null;
            state.appliedCoupon = null;
            state.appliedCouponAuto = false;
            state.couponAutoDismissed = false;
            state.useLoyaltyPoints = false;
            saveDatabase();
            
            if (basePaymentMethod === 'Online Payment / UPI') {
                showToast('Order Placed! Complete the UPI payment on your phone or scan the shop QR in-store.', 'success');
            } else {
                showToast('Order placed successfully!');
            }
            if (pointsEarned > 0) {
                showToast(`You earned ${pointsEarned} reward points on this order!`, 'info');
            }
            setUserTab('orders');
        }

        // Initialize App
        if (state.darkMode) document.body.classList.add('dark-mode');
        render();
    </script>
</body>
</html>
