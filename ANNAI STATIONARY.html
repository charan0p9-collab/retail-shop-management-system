<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Shop Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-10px); }
        }
        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }

        @keyframes marqueeScroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        .marquee-track {
            display: inline-flex;
            white-space: nowrap;
            animation: marqueeScroll 22s linear infinite;
        }
        .marquee-track:hover { animation-play-state: paused; }

        @media print {
            body { background: white; margin: 0; padding: 0; }
            #app, #toast-container { display: none !important; }
            #modal-container { 
                display: block !important; 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%; 
                height: 100%; 
                background: white !important; 
                z-index: 9999; 
                align-items: flex-start;
                padding: 0;
            }
            #modal-content { 
                max-width: 100%; 
                box-shadow: none; 
                transform: none !important; 
                padding: 0; 
                margin: 0; 
            }
            #print-section { width: 100%; padding: 20px; }
            .no-print { display: none !important; }
            ::-webkit-scrollbar { display: none; }
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        /* Hide arrows on number inputs for clean POS UI */
        .hide-arrows::-webkit-outer-spin-button,
        .hide-arrows::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .hide-arrows { -moz-appearance: textfield; }

        /* --- Dark Mode (additive overrides only, doesn't touch existing markup/classes) --- */
        body.dark-mode { background-color: #0f172a; }
        body.dark-mode .bg-slate-50 { background-color: #0f172a !important; }
        body.dark-mode .bg-white { background-color: #1e293b !important; }
        body.dark-mode .bg-slate-100 { background-color: #334155 !important; }
        body.dark-mode .text-slate-800, body.dark-mode .text-slate-700, body.dark-mode .text-slate-600 { color: #e2e8f0 !important; }
        body.dark-mode .text-slate-500, body.dark-mode .text-slate-400 { color: #94a3b8 !important; }
        body.dark-mode .border-slate-200, body.dark-mode .border-slate-100 { border-color: #334155 !important; }
        body.dark-mode ::-webkit-scrollbar-track { background: #1e293b; }
    </style>
</head>
<body class="text-slate-800 overflow-x-hidden antialiased">

    <!-- App Container -->
    <div id="app" class="min-h-screen flex w-full"></div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 w-80"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4 transition-opacity duration-300 overflow-y-auto">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md my-auto transform transition-transform duration-300 scale-95 relative"></div>
    </div>

    <script>
        const defaultState = {
            users: [{ id: 'U0', name: 'CHARAN', mobile: '9751680575', pass: '2006', role: 'admin', address: 'HQ', location: '12.9716,77.5946' }], // Default location for admin
            products: [], purchases: [], orders: [], suppliers: [],
            shopDetails: { name: 'ANNAI STATIONARY', mobile: '9751680575-994198676', address: 'GANDHI ROAD - SHOLINGHUR (631102)', description: 'Best products Purchase enjoy in your Family.', img: '', upiId: '' },
            deliveryFeeRules: [],
            coupons: [],
            reviews: [],
            banners: [],
            loyaltySettings: { pointsEarned: 1, perPurchaseValue: 100, pointsRequired: 5, rupeeValue: 1, maxRedemptionPercent: 100 } // earn pointsEarned pts per ₹perPurchaseValue spent; pointsRequired pts = ₹rupeeValue; at most maxRedemptionPercent% of the payable amount can be paid with points
        };

        let state = {
            ...JSON.parse(localStorage.getItem('retailAppDB') || JSON.stringify(defaultState)),
            currentUser: null,
            cart: [],
            currentAdminTab: 'dashboard',
            currentUserTab: 'catalog',
            selectedCategory: 'All',
            authMode: 'login',
            loginRole: 'customer', // 'customer' or 'admin' — which login form is shown on the front page
            purchaseDraft: {
                supplierId: '', company: '', mobile: '', address: '', status: 'Paid',
                items: [{ id: Date.now(), category: '', name: '', exp: '', qty: 1, buyPrice: '', retailPrice: '', wholesalePrice: '', mrp: '', img: '' }]
            },
            supplierDraft: { id: '', company: '', mobile: '', address: '', category: '', products: '' },
            manualBillingCart: [],
            deliveryFee: 0,
            discount: 0,
            checkoutDeliveryFee: 0, // Added for user checkout
            regStep: 'contact',      // 'contact' -> 'otp' -> 'details'
            regContactType: 'mobile', // 'mobile' or 'email'
            regContact: '',
            selectedUpiApp: null,
            couponCode: '',
            appliedCoupon: null,
            appliedCouponAuto: false,   // true when appliedCoupon was picked automatically, not typed by the user
            couponAutoDismissed: false, // true after the user removes an auto-applied coupon, until the cart changes again
            currentUserWishlistView: false,
            darkMode: localStorage.getItem('retailAppDarkMode') === '1',
            useLoyaltyPoints: false,
            sortBy: 'relevance',
            maxPriceFilter: null,
            staffDraft: { id: '', name: '', mobile: '', pass: '' }
        };

        if (!state.suppliers) state.suppliers = [];
        if (!state.deliveryFeeRules) state.deliveryFeeRules = [];
        if (!state.coupons) state.coupons = [];
        if (!state.reviews) state.reviews = [];
        if (!state.banners) state.banners = [];
        if (!state.loyaltySettings) state.loyaltySettings = { pointsEarned: 1, perPurchaseValue: 100, pointsRequired: 5, rupeeValue: 1, maxRedemptionPercent: 100 };
        // Migrate older saved data that only had earnPerRupee / redeemPointsPerRupee
        if (typeof state.loyaltySettings.pointsEarned !== 'number') {
            state.loyaltySettings.pointsEarned = 1;
            state.loyaltySettings.perPurchaseValue = state.loyaltySettings.earnPerRupee || 100;
            state.loyaltySettings.pointsRequired = state.loyaltySettings.redeemPointsPerRupee || 10;
            state.loyaltySettings.rupeeValue = 1;
        }
        if (typeof state.loyaltySettings.maxRedemptionPercent !== 'number') state.loyaltySettings.maxRedemptionPercent = 100;
        state.users.forEach(u => { if (!u.wishlist) u.wishlist = []; if (typeof u.loyaltyPoints !== 'number') u.loyaltyPoints = 0; });

        // --- Reward point helper functions (single source of truth for all earn/redeem math) ---
        function loyaltyEarnForAmount(amount) {
            const s = state.loyaltySettings;
            if (!s.perPurchaseValue) return 0;
            return Math.floor(amount / s.perPurchaseValue) * (s.pointsEarned || 0);
        }
        function loyaltyPointsValueInRupees(points) {
            const s = state.loyaltySettings;
            if (!s.pointsRequired) return 0;
            return Math.floor((points * (s.rupeeValue || 0)) / s.pointsRequired);
        }
        function loyaltyPointsForRupees(rupees) {
            const s = state.loyaltySettings;
            if (!s.rupeeValue) return 0;
            return Math.ceil((rupees * s.pointsRequired) / s.rupeeValue);
        }
        function loyaltyMaxRedeemableRupees(payable) {
            const s = state.loyaltySettings;
            const pct = typeof s.maxRedemptionPercent === 'number' ? s.maxRedemptionPercent : 100;
            return Math.floor((payable * pct) / 100);
        }

        function saveDatabase() {
            const dbData = {
                users: state.users,
                products: state.products,
                purchases: state.purchases,
                orders: state.orders,
                shopDetails: state.shopDetails,
                suppliers: state.suppliers,
                deliveryFeeRules: state.deliveryFeeRules,
                coupons: state.coupons,
                reviews: state.reviews,
                banners: state.banners,
                loyaltySettings: state.loyaltySettings
            };
            localStorage.setItem('retailAppDB', JSON.stringify(dbData));
        }

        let regImageBase64 = '';
        let bannerDraftImg = '';
        let salesChartInstance = null;
        let regGeneratedOtp = ''; // Demo-mode OTP holder (no real SMS/Email gateway connected)
        const REFERRAL_BONUS_POINTS = 50; // flat reward points given to both the new customer and the referrer

        // Returns a customer's referral code, generating and persisting a stable one on first use.
        function getUserReferralCode(user) {
            if (user.referralCode) return user.referralCode;
            const code = 'REF' + (user.id || '').replace(/[^A-Za-z0-9]/g, '').slice(-6).toUpperCase();
            user.referralCode = code;
            const idx = state.users.findIndex(u => u.id === user.id);
            if (idx > -1) state.users[idx].referralCode = code;
            saveDatabase();
            return code;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icons = { success: 'fa-check-circle text-emerald-400', error: 'fa-circle-xmark text-rose-400', info: 'fa-info-circle text-blue-400' };
            const borders = { success: 'border-emerald-500', error: 'border-rose-500', info: 'border-blue-500' };
            
            toast.className = `bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl flex items-start gap-3 toast-enter border-l-4 ${borders[type]}`;
            toast.innerHTML = `<i class="fas ${icons[type]} mt-1 text-lg"></i> <div class="flex-1"><p class="text-sm font-medium leading-snug">${message}</p></div>
                               <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xs"></i></button>`;
            container.appendChild(toast);
            setTimeout(() => {
                if(toast.parentElement) {
                    toast.classList.replace('toast-enter', 'toast-exit');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        function openModal(contentHTML, maxWidth = 'max-w-md') {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.className = `bg-white rounded-2xl shadow-2xl p-6 w-full ${maxWidth} my-auto transform transition-transform duration-300 scale-95 relative`;
            content.innerHTML = contentHTML;
            container.classList.remove('hidden');
            setTimeout(() => content.classList.replace('scale-95', 'scale-100'), 10);
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.classList.replace('scale-100', 'scale-95');
            setTimeout(() => container.classList.add('hidden'), 200);
        }

        // Central color map for order/sales progress statuses — used by Sales Book
        // and anywhere else a status needs a distinct, consistent color.
        function getOrderStatusStyle(status) {
            const map = {
                'Progress':          { bg: '#dbeafe', text: '#1d4ed8', border: '#93c5fd', dot: '#3b82f6' },
                'Order Confirmed':   { bg: '#fef3c7', text: '#b45309', border: '#fcd34d', dot: '#f59e0b' },
                'Packed':            { bg: '#cffafe', text: '#0e7490', border: '#67e8f9', dot: '#06b6d4' },
                'Out for Delivery':  { bg: '#f3e8ff', text: '#7e22ce', border: '#d8b4fe', dot: '#a855f7' },
                'Delivered':         { bg: '#d1fae5', text: '#047857', border: '#6ee7b7', dot: '#10b981' },
                'Canceled':          { bg: '#ffe4e6', text: '#be123c', border: '#fda4af', dot: '#f43f5e' },
                'Return Requested':  { bg: '#fff7ed', text: '#c2410c', border: '#fdba74', dot: '#f97316' },
                'Refunded':          { bg: '#f1f5f9', text: '#475569', border: '#cbd5e1', dot: '#64748b' },
            };
            return map[status] || map['Progress'];
        }

        function generateId(prefix = 'ID') {
            return prefix + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2, 4).toUpperCase();
        }

        function formatDate(isoString) {
            if(!isoString) return 'N/A';
            return new Date(isoString).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        if (state.currentUser) {
                            state.currentUser.location = `${lat},${lon}`;
                            const userIndex = state.users.findIndex(u => u.id === state.currentUser.id);
                            if (userIndex !== -1) {
                                state.users[userIndex] = state.currentUser;
                                saveDatabase();
                                showToast('Location updated successfully.', 'info');
                            }
                        }
                    },
                    (error) => {
                        console.error("Error getting location:", error);
                        showToast('Could not retrieve location. Please enable location services.', 'error');
                    }
                );
            } else {
                showToast("Geolocation is not supported by this browser.", "error");
            }
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = renderAuthView();
            } else if (state.currentUser.role === 'admin' || state.currentUser.role === 'staff') {
                app.innerHTML = renderAdminDashboard();
                if (state.currentAdminTab === 'dashboard') {
                    setTimeout(initDashboardChart, 100);
                }
            } else {
                app.innerHTML = renderUserDashboard();
                if (state.currentUserTab === 'catalog') {
                    setTimeout(initBannerCarousel, 50);
                } else if (bannerTimer) {
                    clearInterval(bannerTimer);
                    bannerTimer = null;
                }
            }
        }

        function renderAuthView() {
            const isLogin = state.authMode !== 'register';
            const defaultImg = 'https://images.unsplash.com/photo-1542838132-92c53300491e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1567&q=80';
            const displayImage = state.shopDetails.img || defaultImg;
            
            return `
                <div class="flex w-full min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 relative overflow-hidden">
                    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="absolute bottom-0 right-0 w-[30rem] h-[30rem] bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
                    <img src="${displayImage}" class="hidden lg:block absolute inset-y-0 left-0 w-1/2 h-full object-cover opacity-[0.08] z-0" alt="Store Background">

                    <div class="hidden lg:flex lg:w-1/2 relative flex-col justify-center p-16 text-white z-10">
                        <div class="max-w-xl">
                            ${state.shopDetails.img ? `<img src="${state.shopDetails.img}" class="w-20 h-20 rounded-2xl object-cover border-2 border-white/20 shadow-2xl mb-8">` : `<div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center text-3xl mb-8 border border-white/20"><i class="fas fa-store-alt"></i></div>`}
                            <h1 class="text-5xl font-black mb-4 leading-tight tracking-tight">${state.shopDetails.name}</h1>
                            <p class="text-lg text-slate-300 leading-relaxed font-light mb-10">${state.shopDetails.description}</p>

                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-5 hover:bg-white/10 transition">
                                    <div class="w-9 h-9 rounded-lg bg-indigo-500/20 text-indigo-300 flex items-center justify-center text-base mb-3"><i class="fas fa-chart-line"></i></div>
                                    <h3 class="font-bold text-sm mb-0.5">Smart Analytics</h3>
                                    <p class="text-xs text-slate-400">Sales, stock &amp; profit insights</p>
                                </div>
                                <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-5 hover:bg-white/10 transition">
                                    <div class="w-9 h-9 rounded-lg bg-amber-500/20 text-amber-300 flex items-center justify-center text-base mb-3"><i class="fas fa-coins"></i></div>
                                    <h3 class="font-bold text-sm mb-0.5">Reward Wallet</h3>
                                    <p class="text-xs text-slate-400">Points earning &amp; redemption</p>
                                </div>
                                <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-5 hover:bg-white/10 transition">
                                    <div class="w-9 h-9 rounded-lg bg-rose-500/20 text-rose-300 flex items-center justify-center text-base mb-3"><i class="fas fa-tags"></i></div>
                                    <h3 class="font-bold text-sm mb-0.5">Offers &amp; Coupons</h3>
                                    <p class="text-xs text-slate-400">Promotions made easy</p>
                                </div>
                                <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-5 hover:bg-white/10 transition">
                                    <div class="w-9 h-9 rounded-lg bg-emerald-500/20 text-emerald-300 flex items-center justify-center text-base mb-3"><i class="fas fa-user-shield"></i></div>
                                    <h3 class="font-bold text-sm mb-0.5">Separate Access</h3>
                                    <p class="text-xs text-slate-400">Customer &amp; admin portals</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="w-full lg:w-1/2 flex items-center justify-center p-6 md:p-10 relative z-10">
                        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 md:p-10">
                            <div class="text-center mb-8 flex flex-col items-center">
                                <!-- Mobile Logo representation -->
                                ${state.shopDetails.img ? `<img src="${state.shopDetails.img}" class="lg:hidden w-20 h-20 rounded-2xl object-cover shadow-lg mb-5 border border-slate-100">` : ''}
                                <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">${isLogin ? (state.loginRole === 'admin' ? 'Admin Login' : 'Customer Login') : 'Create Account'}</h2>
                                <p class="text-slate-500 mt-2 font-medium text-sm">${isLogin ? (state.loginRole === 'admin' ? 'Sign in to manage your store.' : 'Sign in to shop, track orders and earn reward points.') : 'Join to start shopping today!'}</p>
                            </div>
                            
                            ${isLogin ? `
                                <div class="flex bg-slate-100 rounded-xl p-1 mb-6">
                                    <button type="button" onclick="setLoginRole('customer')" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition ${state.loginRole !== 'admin' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}"><i class="fas fa-user mr-1.5"></i>Customer Login</button>
                                    <button type="button" onclick="setLoginRole('admin')" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition ${state.loginRole === 'admin' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}"><i class="fas fa-user-shield mr-1.5"></i>Admin / Staff Login</button>
                                </div>
                                <form onsubmit="handleLogin(event)" class="space-y-5">
                                    <div>
                                        <label class="block text-sm font-bold text-slate-700 mb-1">${state.loginRole === 'admin' ? 'Admin ID / Mobile' : 'Mobile Number or Email'}</label>
                                        <div class="relative">
                                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fas fa-user"></i></div>
                                            <input type="text" id="login-id" required placeholder="${state.loginRole === 'admin' ? 'admin' : 'Enter mobile or email'}" class="pl-10 w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-slate-700 mb-1">PIN (4 Digits)</label>
                                        <div class="relative">
                                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fas fa-lock"></i></div>
                                            <input type="password" id="login-pass" pattern="\\d{4}" maxlength="4" required placeholder="1234" class="pl-10 w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                                        </div>
                                    </div>
                                    <button type="submit" class="w-full ${state.loginRole === 'admin' ? 'bg-slate-800 hover:bg-slate-900 hover:shadow-slate-500/30' : 'bg-indigo-600 hover:bg-indigo-700 hover:shadow-indigo-500/30'} text-white font-bold text-lg py-3.5 rounded-xl hover:shadow-lg transition-all active:scale-[0.98]">${state.loginRole === 'admin' ? 'Sign In as Admin' : 'Sign In'}</button>
                                </form>
                                <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                                    <p class="text-slate-600 font-medium">New here? <button onclick="toggleAuthMode()" class="text-indigo-600 font-bold hover:text-indigo-800 transition">Register as Customer</button></p>
                                </div>
                            ` : `
                                ${state.regStep === 'otp' ? `
                                    <form onsubmit="verifyRegistrationOtp(event)" class="space-y-5">
                                        <div class="text-center mb-2">
                                            <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl"><i class="fas fa-shield-alt"></i></div>
                                            <p class="text-sm text-slate-500">Enter the 4-digit OTP sent to<br><span class="font-bold text-slate-700">${state.regContact}</span></p>
                                        </div>
                                        <div>
                                            <label class="block text-sm font-bold text-slate-700 mb-1">OTP Code</label>
                                            <input type="text" id="reg-otp-input" required pattern="\\d{4}" maxlength="4" placeholder="0000" autocomplete="one-time-code" class="w-full px-4 py-3 text-center tracking-[0.6em] font-black text-xl bg-slate-50 rounded-xl border border-slate-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                                        </div>
                                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold text-lg py-3.5 rounded-xl hover:bg-indigo-700 hover:shadow-lg hover:shadow-indigo-500/30 transition-all active:scale-[0.98]">Verify OTP</button>
                                        <div class="flex justify-between items-center text-xs font-bold pt-2">
                                            <button type="button" onclick="backToContactStep()" class="text-slate-500 hover:text-slate-800"><i class="fas fa-arrow-left mr-1"></i> Change ${state.regContactType === 'mobile' ? 'Number' : 'Email'}</button>
                                            <button type="button" onclick="resendRegistrationOtp()" class="text-indigo-600 hover:text-indigo-800">Resend OTP</button>
                                        </div>
                                    </form>
                                ` : state.regStep === 'details' ? `
                                    <form onsubmit="handleRegister(event)" class="space-y-4">
                                        <div class="flex justify-center mb-6">
                                            <div class="relative w-24 h-24 rounded-full bg-slate-100 border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden group hover:border-indigo-400 transition">
                                                <i id="reg-photo-icon" class="fas fa-camera text-slate-400 text-2xl group-hover:text-indigo-500 transition"></i>
                                                <img id="reg-photo-preview" src="" class="hidden w-full h-full object-cover">
                                                <input type="file" id="reg-photo" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" onchange="handleImageUpload(event)">
                                            </div>
                                        </div>
                                        <div class="grid grid-cols-2 gap-4">
                                            <div class="col-span-2"><label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Full Name</label><input type="text" id="reg-name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                            ${state.regContactType === 'mobile' ? `
                                                <div class="col-span-2"><label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Email (Optional)</label><input type="email" id="reg-email-extra" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                            ` : `
                                                <div class="col-span-2"><label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Mobile Number</label><input type="tel" id="reg-mobile-extra" required pattern="[0-9]{10}" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                            `}
                                            <div class="col-span-1"><label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">4-Digit PIN</label><input type="password" id="reg-pass" pattern="\\d{4}" maxlength="4" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                                            <div class="col-span-2"><label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Address</label><textarea id="reg-address" required rows="2" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea></div>
                                            <div class="col-span-2"><label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Referral Code (Optional)</label><input type="text" id="reg-referral" placeholder="Have a friend's code?" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none uppercase font-mono"></div>
                                        </div>
                                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition mt-2 shadow-md">Create Account</button>
                                    </form>
                                ` : `
                                    <div class="flex bg-slate-100 rounded-xl p-1 mb-5">
                                        <button type="button" onclick="setRegContactType('mobile')" class="flex-1 py-2 rounded-lg text-sm font-bold transition ${state.regContactType === 'mobile' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}"><i class="fas fa-mobile-alt mr-1"></i> Phone</button>
                                        <button type="button" onclick="setRegContactType('email')" class="flex-1 py-2 rounded-lg text-sm font-bold transition ${state.regContactType === 'email' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}"><i class="fas fa-envelope mr-1"></i> Email</button>
                                    </div>
                                    <form onsubmit="sendRegistrationOtp(event)" class="space-y-5">
                                        ${state.regContactType === 'mobile' ? `
                                            <div>
                                                <label class="block text-sm font-bold text-slate-700 mb-1">Mobile Number</label>
                                                <input type="tel" id="reg-contact-mobile" required pattern="[0-9]{10}" placeholder="10-digit mobile number" class="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                                            </div>
                                        ` : `
                                            <div>
                                                <label class="block text-sm font-bold text-slate-700 mb-1">Email Address</label>
                                                <input type="email" id="reg-contact-email" required placeholder="you@example.com" class="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                                            </div>
                                        `}
                                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold text-lg py-3.5 rounded-xl hover:bg-indigo-700 hover:shadow-lg hover:shadow-indigo-500/30 transition-all active:scale-[0.98]">Send OTP</button>
                                    </form>
                                `}
                                <div class="mt-6 text-center">
                                    <button onclick="toggleAuthMode()" class="text-slate-500 font-medium hover:text-slate-800 text-sm"><i class="fas fa-arrow-left mr-1"></i> Back to Login</button>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleAuthMode() {
            state.authMode = state.authMode === 'register' ? 'login' : 'register';
            regImageBase64 = '';
            state.regStep = 'contact';
            state.regContactType = 'mobile';
            state.regContact = '';
            regGeneratedOtp = '';
            render();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    regImageBase64 = evt.target.result;
                    const preview = document.getElementById('reg-photo-preview');
                    const icon = document.getElementById('reg-photo-icon');
                    preview.src = regImageBase64;
                    preview.classList.remove('hidden');
                    icon.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function checkForNewPromotions() {
            if (!state.currentUser || state.currentUser.role === 'admin') return;
            const seenKey = `retailAppSeenPromos_${state.currentUser.id}`;
            let seen = [];
            try { seen = JSON.parse(localStorage.getItem(seenKey) || '[]'); } catch(e) { seen = []; }

            const activeCoupons = (state.coupons || []).filter(c => c.active !== false && (!c.expiry || new Date(c.expiry).getTime() >= Date.now()));
            const activeBanners = (state.banners || []).filter(b => b.active !== false && (!b.expiry || new Date(b.expiry).getTime() >= Date.now()));

            const newCoupons = activeCoupons.filter(c => !seen.includes('C_' + c.code));
            const newBanners = activeBanners.filter(b => !seen.includes('B_' + b.id));

            newCoupons.forEach(c => {
                showToast(`New coupon available: ${c.code} - ${c.type === 'percent' ? c.value + '% OFF' : '₹' + c.value + ' OFF'}`, 'info');
            });
            newBanners.forEach(b => {
                showToast(`New offer: ${b.title}`, 'info');
            });

            const updatedSeen = [
                ...activeCoupons.map(c => 'C_' + c.code),
                ...activeBanners.map(b => 'B_' + b.id)
            ];
            localStorage.setItem(seenKey, JSON.stringify(updatedSeen));
        }

        function setLoginRole(role) {
            state.loginRole = role;
            render();
        }

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            const pass = document.getElementById('login-pass').value;

            const user = state.users.find(u => (u.name.toLowerCase() === id.toLowerCase() || u.mobile === id || (u.email && u.email.toLowerCase() === id.toLowerCase())) && u.pass === pass);

            if (!user) {
                showToast('Invalid credentials. Check ID or PIN.', 'error');
                return;
            }

            const wantsAdmin = state.loginRole === 'admin';
            const isStaffSide = user.role === 'admin' || user.role === 'staff';
            if (wantsAdmin !== isStaffSide) {
                showToast(`That account is ${isStaffSide ? 'a Staff/Admin' : 'a Customer'} account. Switch to ${isStaffSide ? 'Admin' : 'Customer'} Login above.`, 'error');
                return;
            }

            state.currentUser = user;
            showToast(`Welcome back, ${user.name}!`);
            render();
            setTimeout(checkForNewPromotions, 600);
        }

        function setRegContactType(type) {
            state.regContactType = type;
            render();
        }

        function sendRegistrationOtp(e) {
            e.preventDefault();
            const type = state.regContactType;
            const inputId = type === 'mobile' ? 'reg-contact-mobile' : 'reg-contact-email';
            const value = document.getElementById(inputId).value.trim();

            if (type === 'mobile' && !/^[0-9]{10}$/.test(value)) {
                showToast('Enter a valid 10-digit mobile number.', 'error');
                return;
            }
            if (type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
                showToast('Enter a valid email address.', 'error');
                return;
            }
            if (type === 'mobile' && state.users.some(u => u.mobile === value)) {
                showToast('Mobile number already registered.', 'error');
                return;
            }
            if (type === 'email' && state.users.some(u => u.email && u.email.toLowerCase() === value.toLowerCase())) {
                showToast('Email already registered.', 'error');
                return;
            }

            state.regContact = value;

            // Demo Mode: no backend/SMS gateway connected, OTP is generated locally.
            regGeneratedOtp = Math.floor(1000 + Math.random() * 9000).toString();
            state.regStep = 'otp';
            render();
            showToast(`Demo Mode: OTP for ${value} is ${regGeneratedOtp}`, 'info');
        }

        function resendRegistrationOtp() {
            regGeneratedOtp = Math.floor(1000 + Math.random() * 9000).toString();
            showToast(`Demo Mode: New OTP is ${regGeneratedOtp}`, 'info');
        }

        function verifyRegistrationOtp(e) {
            e.preventDefault();
            const entered = document.getElementById('reg-otp-input').value.trim();

            if (regGeneratedOtp && entered === regGeneratedOtp) {
                state.regStep = 'details';
                render();
                showToast('Verified successfully!');
            } else {
                showToast('Incorrect OTP. Please try again.', 'error');
            }
        }

        function backToContactStep() {
            state.regStep = 'contact';
            regGeneratedOtp = '';
            render();
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const address = document.getElementById('reg-address').value.trim();

            let mobile, email;
            if (state.regContactType === 'mobile') {
                mobile = state.regContact;
                const emailEl = document.getElementById('reg-email-extra');
                email = emailEl ? emailEl.value.trim() : '';
            } else {
                email = state.regContact;
                mobile = document.getElementById('reg-mobile-extra').value.trim();
                if (!/^[0-9]{10}$/.test(mobile)) {
                    showToast('Enter a valid 10-digit mobile number.', 'error');
                    return;
                }
                if (state.users.some(u => u.mobile === mobile)) {
                    showToast('Mobile number already registered.', 'error');
                    return;
                }
            }

            const newUser = { id: generateId('U'), name, mobile, email: email || '', pass, address, role: 'user', img: regImageBase64, location: '', loyaltyPoints: 0 };

            // Optional referral code: awards a flat bonus to both the new customer and the referrer.
            const referralInput = document.getElementById('reg-referral');
            const referralCode = referralInput ? referralInput.value.trim().toUpperCase() : '';
            let referrer = null;
            if (referralCode) {
                referrer = state.users.find(u => u.role === 'user' && u.referralCode && u.referralCode.toUpperCase() === referralCode);
                if (referrer) {
                    newUser.loyaltyPoints = REFERRAL_BONUS_POINTS;
                    newUser.referredBy = referrer.id;
                    referrer.loyaltyPoints = (referrer.loyaltyPoints || 0) + REFERRAL_BONUS_POINTS;
                } else {
                    showToast('Referral code not found — continuing without bonus.', 'info');
                }
            }

            state.users.push(newUser);
            saveDatabase();

            state.currentUser = newUser;
            regImageBase64 = '';
            state.regStep = 'contact';
            state.regContactType = 'mobile';
            state.regContact = '';
            regGeneratedOtp = '';
            showToast(referrer ? `Registration successful! You earned ${REFERRAL_BONUS_POINTS} bonus points 🎉` : 'Registration successful! Welcome.');
            render();
            setTimeout(checkForNewPromotions, 600);
        }

        function logout() {
            state.currentUser = null;
            state.cart = [];
            showToast('Logged out successfully.');
            render();
        }

        // Tabs a 'staff' account is permitted to see/use. Everything else (settings,
        // coupons/banners, delivery rules, analytics, data export, staff management)
        // stays admin-only.
        const STAFF_ALLOWED_TABS = ['billing', 'catalog', 'purchase', 'purchaseHistory', 'salesHistory'];

        function renderAdminDashboard() {
            const isStaff = state.currentUser.role === 'staff';
            let tabs = [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Overview' },
                { id: 'billing', icon: 'fa-desktop', label: 'POS Terminal' },
                { id: 'catalog', icon: 'fa-boxes', label: 'Inventory' },
                { id: 'supplierSetup', icon: 'fa-building', label: 'Supplier Setup' },
                { id: 'purchase', icon: 'fa-truck-loading', label: 'Add To Stock' },
                { id: 'salesHistory', icon: 'fa-receipt', label: 'Sales Book' },
                { id: 'purchaseHistory', icon: 'fa-history', label: 'Purchase Book' },
                { id: 'deliveryFee', icon: 'fa-truck', label: 'Delivery Fee' },
                { id: 'coupons', icon: 'fa-tags', label: 'Coupons' },
                { id: 'rewards', icon: 'fa-coins', label: 'Rewards' },
                { id: 'banners', icon: 'fa-images', label: 'Banners' },
                { id: 'profit', icon: 'fa-chart-line', label: 'Analytics' },
                { id: 'staffManagement', icon: 'fa-user-tie', label: 'Staff Accounts' },
                { id: 'dataManagement', icon: 'fa-database', label: 'Data & CSV' },
                { id: 'shopDetails', icon: 'fa-cog', label: 'Settings' }
            ];
            if (isStaff) tabs = tabs.filter(t => STAFF_ALLOWED_TABS.includes(t.id));
            if (isStaff && !STAFF_ALLOWED_TABS.includes(state.currentAdminTab)) state.currentAdminTab = 'billing';

            return `
                <div class="flex w-full h-screen bg-slate-50 overflow-hidden">
                    <aside class="w-64 bg-slate-900 text-white flex flex-col transition-all duration-300 shadow-2xl z-20 flex-shrink-0">
                        <div class="p-5 flex items-center gap-3 border-b border-slate-800 bg-slate-950/50">
                            <div class="w-10 h-10 rounded-xl bg-indigo-500 text-white flex items-center justify-center font-bold text-lg overflow-hidden shadow-inner">
                                ${state.currentUser.img ? `<img src="${state.currentUser.img}" class="w-full h-full object-cover">` : `<i class="fas ${isStaff ? 'fa-user-tie' : 'fa-user-shield'}"></i>`}
                            </div>
                            <div>
                                <h3 class="font-black text-sm tracking-wide">${isStaff ? 'STAFF · ' + state.currentUser.name.toUpperCase() : 'ADMINISTRATOR'}</h3>
                                <p class="text-slate-400 text-xs truncate w-40">${state.shopDetails.name}</p>
                            </div>
                        </div>
                        <nav class="flex-1 overflow-y-auto py-3 custom-scrollbar">
                            <div class="px-4 pb-2 mb-2 border-b border-slate-800 text-[10px] font-black text-slate-500 uppercase tracking-widest">Main Menu</div>
                            ${tabs.map(tab => `
                                <button onclick="setAdminTab('${tab.id}')" class="w-full flex items-center gap-3 px-6 py-2.5 text-left transition-all duration-200 ${state.currentAdminTab === tab.id ? 'bg-indigo-600 text-white border-r-4 border-white font-semibold' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200 font-medium'} text-sm">
                                    <i class="fas ${tab.icon} w-5 text-center text-lg ${state.currentAdminTab === tab.id ? 'text-white' : 'text-slate-500'}"></i>
                                    ${tab.label}
                                </button>
                            `).join('')}
                        </nav>
                        <div class="p-4 bg-slate-950 space-y-2">
                            <button onclick="toggleDarkModeAndRender()" class="w-full flex items-center gap-2 justify-center py-2.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white transition-all font-bold text-sm">
                                <i class="fas ${state.darkMode ? 'fa-sun' : 'fa-moon'}"></i> ${state.darkMode ? 'Light Mode' : 'Dark Mode'}
                            </button>
                            <button onclick="logout()" class="w-full flex items-center gap-2 justify-center py-2.5 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white transition-all font-bold text-sm">
                                <i class="fas fa-sign-out-alt"></i> Sign Out
                            </button>
                        </div>
                    </aside>
                    <main class="flex-1 overflow-y-auto relative p-6 lg:p-8 custom-scrollbar">
                        <div class="max-w-7xl mx-auto">
                            ${getAdminTabContent()}
                        </div>
                    </main>
                </div>
            `;
        }

        function setAdminTab(tab) {
            if (state.currentUser && state.currentUser.role === 'staff' && !STAFF_ALLOWED_TABS.includes(tab)) return;
            state.currentAdminTab = tab;
            render();
        }

        // Applies the active sort order and optional max-price cap to a product list.
        // Used by the storefront catalog and wishlist grids.
        function applySortAndFilter(products) {
            let list = [...products];
            if (state.maxPriceFilter) {
                list = list.filter(p => p.retailPrice <= state.maxPriceFilter);
            }
            switch (state.sortBy) {
                case 'priceLow': list.sort((a, b) => a.retailPrice - b.retailPrice); break;
                case 'priceHigh': list.sort((a, b) => b.retailPrice - a.retailPrice); break;
                case 'rating': list.sort((a, b) => getProductRating(b.id).avg - getProductRating(a.id).avg); break;
                case 'newest': list.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0)); break;
                case 'discount':
                    list.sort((a, b) => ((b.mrp - b.retailPrice) / (b.mrp || 1)) - ((a.mrp - a.retailPrice) / (a.mrp || 1)));
                    break;
                default: break; // 'relevance' — keep original order
            }
            return list;
        }

        function setSortBy(val) {
            state.sortBy = val;
            const gridEl = document.getElementById('user-product-grid');
            if (gridEl && state.currentUser && state.currentUserTab === 'catalog') {
                const activeCat = state.selectedCategory || 'All';
                const availableProducts = state.products.filter(p => p.qty > 0);
                const filteredProducts = availableProducts.filter(p => activeCat === 'All' || p.category === activeCat);
                gridEl.innerHTML = renderUserProductGrid(applySortAndFilter(filteredProducts));
            } else {
                render();
            }
        }

        function setPriceFilter(val) {
            state.maxPriceFilter = val ? Number(val) : null;
            const priceLabel = document.getElementById('price-filter-label');
            if (priceLabel) priceLabel.textContent = state.maxPriceFilter ? ('Up to ₹' + state.maxPriceFilter) : 'Any price';
            const gridEl = document.getElementById('user-product-grid');
            if (gridEl && state.currentUser && state.currentUserTab === 'catalog') {
                const activeCat = state.selectedCategory || 'All';
                const availableProducts = state.products.filter(p => p.qty > 0);
                const filteredProducts = availableProducts.filter(p => activeCat === 'All' || p.category === activeCat);
                gridEl.innerHTML = renderUserProductGrid(applySortAndFilter(filteredProducts));
            }
        }

        function renderSortFilterBar() {
            const maxPossiblePrice = Math.max(100, ...state.products.map(p => p.retailPrice || 0), 100);
            return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 mb-5 flex flex-col sm:flex-row sm:items-center gap-4">
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <span class="text-xs font-black text-slate-500 uppercase tracking-wide"><i class="fas fa-arrow-down-wide-short mr-1"></i>Sort by</span>
                        <select onchange="setSortBy(this.value)" class="border-slate-200 rounded-lg text-sm font-bold text-slate-700 py-1.5 pl-2 pr-7 focus:ring-2 focus:ring-indigo-500 border outline-none bg-slate-50">
                            <option value="relevance" ${state.sortBy === 'relevance' ? 'selected' : ''}>Relevance</option>
                            <option value="priceLow" ${state.sortBy === 'priceLow' ? 'selected' : ''}>Price: Low to High</option>
                            <option value="priceHigh" ${state.sortBy === 'priceHigh' ? 'selected' : ''}>Price: High to Low</option>
                            <option value="rating" ${state.sortBy === 'rating' ? 'selected' : ''}>Customer Rating</option>
                            <option value="discount" ${state.sortBy === 'discount' ? 'selected' : ''}>Discount</option>
                            <option value="newest" ${state.sortBy === 'newest' ? 'selected' : ''}>Newest First</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-3 flex-1 min-w-0">
                        <span class="text-xs font-black text-slate-500 uppercase tracking-wide flex-shrink-0"><i class="fas fa-tag mr-1"></i>Max Price</span>
                        <input type="range" min="0" max="${Math.ceil(maxPossiblePrice / 10) * 10}" step="10" value="${state.maxPriceFilter || 0}" oninput="document.getElementById('price-filter-label').textContent = this.value == 0 ? 'Any price' : '₹' + this.value" onchange="setPriceFilter(this.value)" class="flex-1 accent-indigo-600">
                        <span id="price-filter-label" class="text-xs font-bold text-slate-600 w-20 text-right flex-shrink-0">${state.maxPriceFilter ? '₹' + state.maxPriceFilter : 'Any price'}</span>
                    </div>
                </div>
            `;
        }

        function setCategoryFilter(cat) {
            state.selectedCategory = cat;

            // Fast path: if the catalog grid is already on screen, just refresh the
            // category strip + product grid in place (keeps scroll position, no full
            // app re-render). Falls back to a full render() otherwise.
            const stripEl = document.getElementById('user-category-strip');
            const gridEl = document.getElementById('user-product-grid');
            if (stripEl && gridEl && state.currentUser && state.currentUserTab === 'catalog') {
                const categories = ['All', ...new Set(state.products.map(p => p.category))];
                const availableProducts = state.products.filter(p => p.qty > 0);
                const filteredProducts = availableProducts.filter(p => cat === 'All' || p.category === cat);
                stripEl.outerHTML = renderCategoryIconStrip(categories);
                gridEl.innerHTML = renderUserProductGrid(applySortAndFilter(filteredProducts));
            } else {
                render();
            }
        }

        // Ranks products by total quantity sold across all non-canceled orders,
        // and renders a small leaderboard panel for the admin dashboard.
        function getTopSellingProducts(limit = 5) {
            const qtyMap = {};
            state.orders.filter(o => o.status !== 'Canceled' && o.status !== 'Refunded').forEach(o => {
                (o.items || []).forEach(item => {
                    qtyMap[item.id] = (qtyMap[item.id] || 0) + item.qty;
                });
            });
            return Object.entries(qtyMap)
                .map(([id, qty]) => ({ product: state.products.find(p => p.id === id), qty }))
                .filter(x => x.product)
                .sort((a, b) => b.qty - a.qty)
                .slice(0, limit);
        }

        function renderTopSellingPanel() {
            const top = getTopSellingProducts(5);
            if (top.length === 0) {
                return `
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mt-8">
                        <h3 class="text-lg font-black text-slate-800 mb-2 border-b border-slate-100 pb-2"><i class="fas fa-ranking-star text-indigo-500 mr-2"></i>Top Selling Products</h3>
                        <p class="text-sm text-slate-400 py-6 text-center">No sales yet — top sellers will show up here once orders come in.</p>
                    </div>
                `;
            }
            const maxQty = top[0].qty;
            return `

        function renderRewardsWalletRows(customers) {
            if (!customers.length) return `<tr><td colspan="5" class="p-8 text-center text-slate-400 font-medium">No customers found.</td></tr>`;
            return customers.map(u => `
                <tr class="border-b border-slate-50 hover:bg-slate-50/50">
                    <td class="py-3 pr-2 font-bold text-slate-700">${u.name}</td>
                    <td class="py-3 pr-2 text-slate-500">${u.mobile || '-'}</td>
                    <td class="py-3 pr-2 font-black text-amber-600">${(u.loyaltyPoints || 0).toLocaleString()}</td>
                    <td class="py-3 pr-2 font-bold text-slate-700">₹${loyaltyPointsValueInRupees(u.loyaltyPoints || 0).toLocaleString()}</td>
                    <td class="py-3 text-right"><button onclick="openAdjustPointsModal('${u.id}')" class="bg-amber-50 hover:bg-amber-500 hover:text-white text-amber-700 font-bold px-3 py-1.5 rounded-lg text-xs transition">Manage</button></td>
                </tr>
            `).join('');
        }

        function filterRewardsWallet(term) {
            const customers = (state.users || []).filter(u => u.role === 'user');
            const t = term.toLowerCase();
            const filtered = customers.filter(u => u.name.toLowerCase().includes(t) || (u.mobile || '').includes(t));
            const tbody = document.getElementById('rewards-wallet-tbody');
            if (tbody) tbody.innerHTML = renderRewardsWalletRows(filtered);
        }

        function openAdjustPointsModal(userId = null) {
            const customers = (state.users || []).filter(u => u.role === 'user');
            const preselected = userId ? customers.find(u => u.id === userId) : null;
            openModal(`
                <div class="p-6">
                    <h3 class="text-xl font-black text-slate-800 mb-1"><i class="fas fa-coins text-amber-500 mr-2"></i>Add / Deduct Points</h3>

                    <form onsubmit="handleAdjustPoints(event)" class="space-y-4">

                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Customer</label>

                                <div class="w-full border border-slate-200 rounded-xl p-3 bg-slate-50 font-bold text-slate-800">${preselected.name} <span class="text-slate-400 font-medium">(${preselected.mobile || 'no mobile'})</span></div>
                                <input type="hidden" id="adjust-points-user" value="${preselected.id}">
                            ` : `

                                    <option value="add">Add Points</option>
                                    <option value="deduct">Deduct Points</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Points</label>
                                <input type="number" id="adjust-points-amount" min="1" step="1" required class="w-full border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 border bg-slate-50 focus:bg-white outline-none font-bold text-slate-800">
                            </div>

                    </form>
                </div>
            `, 'max-w-md');
        }

        function handleAdjustPoints(e) {
            e.preventDefault();
            const userId = document.getElementById('adjust-points-user').value;
            const type = document.getElementById('adjust-points-type').value;
            const amount = parseInt(document.getElementById('adjust-points-amount').value, 10);
            if (!userId) { showToast('Please select a customer.', 'error'); return; }
            if (!amount || amount <= 0) { showToast('Enter a valid points amount.', 'error'); return; }
            const user = state.users.find(u => u.id === userId);
            if (!user) { showToast('Customer not found.', 'error'); return; }
            user.loyaltyPoints = Math.max(0, (user.loyaltyPoints || 0) + (type === 'deduct' ? -amount : amount));
            saveDatabase();
            closeModal();
            showToast(`${type === 'deduct' ? 'Deducted' : 'Added'} ${amount} points ${type === 'deduct' ? 'from' : 'to'} ${user.name}.`, 'success');
            render();
        }

        function initDashboardChart() {
            const ctx = document.getElementById('salesChart');
            if (!ctx) return;
            
            if (salesChartInstance) {
                salesChartInstance.destroy();
            }

            const last7Days = [...Array(7)].map((_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - i);
                return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
            }).reverse();

            const salesData = last7Days.map(dateStr => {
                return state.orders
                    .filter(o => o.status !== 'Canceled' && o.status !== 'Refunded')
                    .filter(o => {
                        const orderDate = new Date(o.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
                        return orderDate === dateStr;
                    })
                    .reduce((sum, o) => sum + (o.total || 0), 0);
            });

            salesChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: last7Days,
                    datasets: [{
                        label: 'Total Revenue (₹)',
                        data: salesData,
                        backgroundColor: '#6366f1',
                        hoverBackgroundColor: '#4f46e5',
                        borderRadius: 6,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            grid: { color: '#f1f5f9' },
                            ticks: { font: { family: 'Inter' } }
                        },
                        x: { 
                            grid: { display: false },
                            ticks: { font: { family: 'Inter' } }
                        }
                    }
                }
            });
        }

                                                        <i class="fas fa-eye mr-1"></i> View ${o.items ? o.items.length : 0} Item(s)
                                                    </button>
                                                </td>
                                                <td class="p-4 font-black text-emerald-600 text-right text-base">₹${o.total.toLocaleString()}</td>
                                                <td class="p-4 text-center">
                                                    <div class="relative inline-block w-full max-w-[130px]">
                                                        <span class="absolute left-3 top-1/2 -translate-y-1/2 w-1.5 h-1.5 rounded-full pointer-events-none" style="background-color:${stStyle.dot};"></span>
                                                        <select onchange="updateOrderStatus('${o.id}', this.value)" class="w-full pl-6 pr-6 py-1.5 rounded-full text-[10px] font-black uppercase cursor-pointer border outline-none appearance-none text-center transition" style="background-color:${stStyle.bg}; color:${stStyle.text}; border-color:${stStyle.border};">
                                                            <option value="Progress" ${(!o.status || o.status === 'Progress') ? 'selected' : ''}>PROGRESS</option>

                                                    </div>

                                                    ${o.paymentStatus === 'Pending' ? `<button onclick="markPaymentReceived('${o.id}')" class="text-emerald-600 hover:text-white bg-emerald-50 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-bold transition block w-full"><i class="fas fa-hand-holding-dollar mr-1"></i> Mark Paid</button>` : ''}

                                                </td>
                                            </tr>

                case 'profit':
                    let productProfits = {};
                    let totalP = 0; let totalR = 0;

                        if (order.status === 'Canceled') return;
                        order.items.forEach(item => {
                            const product = state.products.find(p => p.id === item.id) || state.products.find(p => p.name === item.name);
                            if(product) {
                                const revenue = item.price * item.qty;
                                const cost = product.buyPrice * item.qty;
                                const profit = revenue - cost;

        // Picks the best eligible coupon (highest discount for the current cart) and
        // applies it automatically, without the customer needing to type a code.
        // Leaves a manually-applied coupon alone unless it's no longer eligible, and
        // won't re-apply one right after the user explicitly removes it.
        function autoApplyBestCoupon() {
            if (state.couponAutoDismissed) return;
            const subtotal = state.cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const now = Date.now();
            const isEligible = c => c.active !== false
                && (!c.expiry || new Date(c.expiry).getTime() >= now)
                && subtotal >= (c.minPurchase || 0);
            const discountFor = c => Math.min(c.type === 'percent' ? Math.round(subtotal * (c.value / 100)) : c.value, subtotal);

            // A coupon the user typed in themselves stays applied as long as it's still valid.
            if (state.appliedCoupon && !state.appliedCouponAuto) {
                if (!isEligible(state.appliedCoupon)) {
                    state.appliedCoupon = null;
                    state.appliedCouponAuto = false;
                } else {
                    return;
                }
            }

            const eligible = (state.coupons || []).filter(isEligible);
            if (eligible.length === 0) {
                if (state.appliedCouponAuto) { state.appliedCoupon = null; state.appliedCouponAuto = false; }
                return;
            }
            const best = eligible.reduce((a, b) => (discountFor(b) > discountFor(a) ? b : a));
            if (!state.appliedCoupon || state.appliedCoupon.code !== best.code) {
                state.appliedCoupon = best;
                state.appliedCouponAuto = true;
            }
        }

        function applyCoupon() {
            const input = document.getElementById('checkout-coupon-input');
            const code = input ? input.value.trim().toUpperCase() : '';
            if (!code) { showToast('Enter a coupon code.', 'error'); return; }
            const coupon = state.coupons.find(c => c.code === code);
            if (!coupon) { showToast('Invalid coupon code.', 'error'); return; }
            if (coupon.active === false) { showToast('This coupon is no longer active.', 'error'); return; }
            if (coupon.expiry && new Date(coupon.expiry).getTime() < Date.now()) { showToast('This coupon has expired.', 'error'); return; }
            const cartSubtotal = state.cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            if (coupon.minPurchase && cartSubtotal < coupon.minPurchase) {
                showToast(`Add items worth ₹${coupon.minPurchase - cartSubtotal} more to use this coupon (min. purchase ₹${coupon.minPurchase}).`, 'error');
                return;
            }
            state.appliedCoupon = coupon;
            state.appliedCouponAuto = false;
            state.couponAutoDismissed = false;
            showToast(`Coupon "${coupon.code}" applied!`);
            render();

        function removeCoupon() {
            const wasAuto = state.appliedCouponAuto;
            state.appliedCoupon = null;
            state.appliedCouponAuto = false;
            if (wasAuto) state.couponAutoDismissed = true;
            render();
        }

        function calculateDeliveryFee(orderTotal) {
            if (state.deliveryFeeRules.length === 0) return 0;
            for (const rule of state.deliveryFeeRules) {
                if (orderTotal >= rule.min && (rule.max === null || orderTotal <= rule.max)) {
                    return rule.fee;
                }
            }
            return 0;
        }

        // --- Supplier Logic ---
        function handleSupplierSave(e) {
            e.preventDefault();
            const id = document.getElementById('sup-id').value;
            const company = document.getElementById('sup-company').value.trim();
            const mobile = document.getElementById('sup-mobile').value.trim();
            const category = document.getElementById('sup-category').value.trim();
            const products = document.getElementById('sup-products').value.trim();
            const address = document.getElementById('sup-address').value.trim();

            if (id) {
                const index = state.suppliers.findIndex(s => s.id === id);
                if (index > -1) {
                    state.suppliers[index] = { id, company, mobile, category, products, address };
                    showToast('Supplier updated successfully.');
                }
            } else {
                state.suppliers.push({ id: generateId('SUP'), company, mobile, category, products, address });
                showToast('New supplier added.');
            }
            
            saveDatabase();
            resetSupplierDraft();
            render();
        }

        function editSupplier(id) {
            const sup = state.suppliers.find(s => s.id === id);
            if (sup) {
                state.supplierDraft = { ...sup };
                render();
            }
        }

        function deleteSupplier(id) {
            if (confirm('Are you sure you want to delete this supplier?')) {
                state.suppliers = state.suppliers.filter(s => s.id !== id);
                saveDatabase();
                showToast('Supplier deleted.');
                render();

        // --- Staff Account Logic ---
        function handleStaffSave(e) {
            e.preventDefault();
            const name = document.getElementById('staff-name').value.trim();
            const mobile = document.getElementById('staff-mobile').value.trim();
            const pass = document.getElementById('staff-pass').value.trim();

            const clash = state.users.find(u => u.mobile === mobile && u.id !== state.staffDraft.id);
            if (clash) { showToast('That mobile number is already registered to another account.', 'error'); return; }

            if (state.staffDraft.id) {
                const idx = state.users.findIndex(u => u.id === state.staffDraft.id);
                if (idx > -1) { state.users[idx] = { ...state.users[idx], name, mobile, pass }; }
                showToast('Staff account updated.');
            } else {
                state.users.push({ id: generateId('STF'), name, mobile, pass, role: 'staff', address: 'Staff', location: '', loyaltyPoints: 0, wishlist: [] });
                showToast('Staff account created.');
            }
            state.staffDraft = { id: '', name: '', mobile: '', pass: '' };
            saveDatabase();
            render();
        }

        function editStaff(id) {
            const s = state.users.find(u => u.id === id);
            if (s) { state.staffDraft = { id: s.id, name: s.name, mobile: s.mobile, pass: s.pass }; render(); }
        }

        function deleteStaff(id) {
            if (confirm('Remove this staff account? They will no longer be able to sign in.')) {

                saveDatabase();
                showToast('Staff account removed.');

        function resetSupplierDraft() {

        }

        function populateSupplierDetails(supId) {
            const sup = state.suppliers.find(s => s.id === supId);
            if (sup) {
                state.purchaseDraft.supplierId = sup.id;
                state.purchaseDraft.company = sup.company;
                state.purchaseDraft.mobile = sup.mobile;

                   state.purchaseDraft.items[0].category = sup.category || '';

        // --- Purchase Logic ---
        function addPurchaseItem() {
            const activeSup = state.suppliers.find(s => s.id === state.purchaseDraft.supplierId);
            const defaultCat = activeSup ? activeSup.category : '';
            state.purchaseDraft.items.push({ id: Date.now(), category: defaultCat, name: '', exp: '', qty: 1, buyPrice: '', retailPrice: '', wholesalePrice: '', mrp: '', img: '' });
            render();
        }

        function removePurchaseItem(index) {
            state.purchaseDraft.items.splice(index, 1);
            render();
        }

        function handlePurchaseImageUpload(e, index) {
            const file = e.target.files[0];
            if (file) {
                getBase64(file).then(base64 => {
                    state.purchaseDraft.items[index].img = base64;
                    render();
                });
            }
        }

        function clearPurchaseForm() {
            state.purchaseDraft = {
                supplierId: '', company: '', mobile: '', address: '', status: 'Paid',
                items: [{ id: Date.now(), category: '', name: '', exp: '', qty: 1, buyPrice: '', retailPrice: '', wholesalePrice: '', mrp: '', img: '' }]
            };
            render();
        }

        // Jumps to "Add To Stock" with a low/out-of-stock product's details pre-filled,
        // so restocking it is a one-tap start instead of retyping everything.
        // The admin still picks the supplier manually, since products don't track one.
        function reorderProduct(productId) {
            const p = state.products.find(x => x.id === productId);
            if (!p) return;
            state.purchaseDraft = {
                supplierId: '', company: '', mobile: '', address: '', status: 'Paid',
                items: [{
                    id: Date.now(), category: p.category || '', name: p.name || '', exp: '',
                    qty: 20, buyPrice: p.buyPrice || '', retailPrice: p.retailPrice || '',
                    wholesalePrice: p.wholesalePrice || '', mrp: p.mrp || '', img: p.img || ''
                }]
            };
            state.currentAdminTab = 'purchase';
            showToast(`Reorder started for "${p.name}" — pick a supplier to continue.`, 'info');
            render();
        }

        function handlePurchaseSubmit(e) {
            e.preventDefault();
            
            if(!state.purchaseDraft.supplierId) {
                showToast('Please select a supplier.', 'error'); return;
            }

            const items = state.purchaseDraft.items.map((item, idx) => ({
                id: generateId('P'),
                category: document.getElementById(`pur-cat-${idx}`).value.trim(),
                name: document.getElementById(`pur-name-${idx}`).value.trim(),
                exp: document.getElementById(`pur-exp-${idx}`).value,
                qty: parseInt(document.getElementById(`pur-qty-${idx}`).value),
                buyPrice: parseFloat(document.getElementById(`pur-price-${idx}`).value),
                retailPrice: parseFloat(document.getElementById(`pur-retail-${idx}`).value),
                wholesalePrice: parseFloat(document.getElementById(`pur-wholesale-${idx}`).value),
                mrp: parseFloat(document.getElementById(`pur-mrp-${idx}`).value),
                img: item.img
            }));

            const total = items.reduce((sum, item) => sum + (item.buyPrice * item.qty), 0);
            const status = document.getElementById('pur-status').value;

            const purchaseRecord = {
                id: generateId('PUR'),
                date: new Date().toISOString(),
                supplierId: state.purchaseDraft.supplierId,
                company: state.purchaseDraft.company,
                mobile: state.purchaseDraft.mobile,
                status: status,
                items: items,
                total: total
            };

            state.purchases.push(purchaseRecord);

            items.forEach(newItem => {
                const existingProductIndex = state.products.findIndex(p => p.name.toLowerCase() === newItem.name.toLowerCase() && p.category.toLowerCase() === newItem.category.toLowerCase());
                
                if (existingProductIndex > -1) {
                    state.products[existingProductIndex].qty += newItem.qty;
                    state.products[existingProductIndex].buyPrice = newItem.buyPrice;
                    state.products[existingProductIndex].retailPrice = newItem.retailPrice;
                    state.products[existingProductIndex].wholesalePrice = newItem.wholesalePrice;
                    state.products[existingProductIndex].mrp = newItem.mrp;
                    if(newItem.img) state.products[existingProductIndex].img = newItem.img;
                    if(newItem.exp) state.products[existingProductIndex].exp = newItem.exp;
                } else {
                    state.products.push({ ...newItem, addedAt: Date.now() });
                }
            });

            saveDatabase();
            showToast('Stock added successfully!');
            clearPurchaseForm();
            setAdminTab('catalog');
        }

                            saveDatabase();
                            showToast('Product image updated.');
                            render();
                        }
                    });
                }
            };
            fileInput.click();

        function deleteProduct(id) {

                state.products = state.products.filter(p => p.id !== id);
                saveDatabase();
                showToast('Product removed.');
                render();
            }
        }

        function renderPosProductGrid(products) {
            if(products.length === 0) return '<div class="col-span-full py-10 text-center text-slate-400">No products match search.</div>';
            
            const custTypeEl = document.getElementById('pos-customer-type');
            const custType = custTypeEl ? custTypeEl.value : 'retail';
            
            return products.map(p => {
                const price = custType === 'wholesale' ? p.wholesalePrice : p.retailPrice;
                const inStock = p.qty > 0;
                
                return `

                    </div>
                    <div class="text-[9px] font-bold text-slate-400 uppercase truncate">${p.category}</div>
